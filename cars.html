<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Brain Rush — Christian Quiz</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

<style>
/* ============================================
   MOBILE-FRIENDLY - SOFT COLOR #363535 - FIXED MENU
   ============================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  height:100%;
  margin:0;
  padding:0;
  background:#f0f0f0;
  color:#363535;
  overflow:hidden;
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;
  -webkit-font-smoothing:antialiased;
  -webkit-touch-callout:none;
  touch-action:manipulation;
}
.bg{
  position:fixed;
  inset:0;
  background:url('https://media.istockphoto.com/id/1469529416/vector/decorative-lined-paper-with-children-two-pages-funny-vector-illustration-eps.jpg?s=612x612&w=0&k=20&c=R9ntFhhrR3Hf8jlql_b-5ES_19Cxsjjx1HcbyScyf68=') center/cover no-repeat;
  z-index:0;
  filter:brightness(.98);
}
.overlay{position:fixed;inset:0;z-index:1;pointer-events:none;}
.stage{
  position:relative;
  z-index:2;
  height:100vh;
  width:100vw;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:4px;
}
.book{
  width:100%;
  height:100vh;
  max-width:100%;
  padding:4px;
  position:relative;
  display:flex;
  flex-direction:column;
}

/* ============================================
   HEADER - BIGGER & CLEANER
   ============================================ */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:6px;
  flex-wrap:nowrap;
  padding:8px 12px;
  flex-shrink:0;
  background:rgba(255,255,255,0.5);
  border-radius:12px;
  margin-bottom:4px;
  border:1px solid rgba(255,255,255,0.3);
  position:relative;
  z-index:10;
}
.leftHeader{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:nowrap;
  flex-shrink:0;
}
.logoBox{
  width:34px;
  height:34px;
  border-radius:8px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border:1px solid rgba(0,0,0,0.04);
  flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,0.04);
}
.logoBox img{
  width:80%;
  height:80%;
  object-fit:contain;
}
.titleWrap{
  display:flex;
  flex-direction:column;
  flex-shrink:0;
}
.title{
  font-family:"Patrick Hand",Inter,system-ui,sans-serif;
  font-size:18px;
  margin:0;
  font-weight:900;
  color:#363535;
  line-height:1;
}
.subtitle{
  font-size:8px;
  color:#888;
  font-weight:700;
  opacity:.7;
  margin-top:-1px;
  font-family:Inter;
  letter-spacing:0.5px;
  text-transform:uppercase;
}
.coins{
  display:flex;
  align-items:center;
  gap:4px;
  padding:4px 10px;
  border-radius:8px;
  background:#fff;
  border:1px solid rgba(0,0,0,0.03);
  font-weight:900;
  flex-shrink:0;
}
.coins .coinEmoji{font-size:12px;}
.coins #headerCoins{font-size:12px;color:#363535;}
.qcount{
  font-weight:900;
  color:#363535;
  padding:4px 10px;
  background:rgba(255,255,255,0.7);
  border-radius:8px;
  font-size:11px;
  flex-shrink:0;
}

.streak-badge{
  display:flex;
  align-items:center;
  gap:3px;
  padding:2px 10px;
  border-radius:20px;
  background:linear-gradient(135deg,#ff6b6b,#ffa94d);
  color:#fff;
  font-weight:900;
  font-size:10px;
  flex-shrink:0;
}
.streak-badge .streak-fire{font-size:10px;}
.streak-badge.hidden{display:none;}

.header-right{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:nowrap;
  position:relative;
  flex-shrink:0;
  z-index:20;
}
.menu-btn{
  width:34px;
  height:34px;
  border-radius:50%;
  background:rgba(255,255,255,0.9);
  border:1px solid rgba(0,0,0,0.06);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:700;
  color:#363535;
  position:relative;
  flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,0.04);
  z-index:25;
}
.menu-btn .badge{
  position:absolute;
  top:-3px;
  right:-3px;
  background:#ff6b6b;
  color:#fff;
  font-size:7px;
  font-weight:800;
  width:14px;
  height:14px;
  border-radius:50%;
  display:none;
  align-items:center;
  justify-content:center;
}
.menu-btn .badge.show{display:flex;}

/* ============================================
   MENU DROPDOWN - FIXED (APPEARS ON TOP)
   ============================================ */
.menu-dropdown{
  position:absolute;
  top:calc(100% + 6px);
  right:0;
  background:rgba(255,255,255,0.98);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-radius:14px;
  border:1px solid rgba(0,0,0,0.08);
  box-shadow:0 16px 64px rgba(0,0,0,0.15);
  padding:6px;
  z-index:9999 !important;
  min-width:160px;
  opacity:0;
  transform:translateY(-10px) scale(0.96);
  pointer-events:none;
  transition:all 0.25s cubic-bezier(0.34,1.56,0.64,1);
  display:none;
}
.menu-dropdown.open{
  opacity:1;
  transform:translateY(0) scale(1);
  pointer-events:auto;
  display:block;
}
.menu-dropdown .menu-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
  font-size:12px;
  color:#363535;
  width:100%;
  border:none;
  background:transparent;
  text-align:left;
  transition:background 0.15s ease;
}
.menu-dropdown .menu-item:active{
  background:rgba(123,58,246,0.1);
}
.menu-dropdown .menu-item .icon{font-size:14px;width:22px;text-align:center;}
.menu-dropdown .menu-item .count{
  margin-left:auto;
  background:rgba(123,58,246,0.12);
  padding:1px 8px;
  border-radius:20px;
  font-size:10px;
  font-weight:800;
  color:#7b3af6;
}
.menu-dropdown .menu-item .count.empty{
  background:rgba(255,0,0,0.08);
  color:#ff4757;
}
.menu-dropdown .menu-divider{height:1px;background:rgba(0,0,0,0.06);margin:4px 12px;}
.menu-dropdown .menu-item.danger{color:#ff4757;}
.menu-dropdown .menu-item.danger:active{background:rgba(255,71,87,0.1);}

/* ============================================
   CARD - CLEAN & SPACIOUS
   ============================================ */
.card{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:5px;
  align-items:stretch;
  width:100%;
  position:relative;
  min-height:0;
  background:rgba(255,255,255,0.15);
  border-radius:12px;
  padding:6px;
  z-index:5;
}

.timer-section{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-shrink:0;
}
.timer-compact{
  display:flex;
  align-items:center;
  gap:5px;
  background:rgba(255,255,255,0.8);
  padding:3px 10px 3px 5px;
  border-radius:30px;
  border:1px solid rgba(0,0,0,0.03);
  flex-shrink:0;
}
.timer-compact .mini-circle{
  position:relative;
  width:28px;
  height:28px;
  flex-shrink:0;
}
.timer-compact .mini-circle svg{
  width:100%;
  height:100%;
  transform:rotate(-90deg);
}
.timer-compact .mini-circle .ring-bg{fill:none;stroke:rgba(0,0,0,0.06);stroke-width:4;}
.timer-compact .mini-circle .ring-progress{fill:none;stroke:#7b3af6;stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset 0.3s;}
.timer-compact .mini-circle .ring-pulse{fill:none;stroke:#ff6b6b;stroke-width:2;stroke-linecap:round;opacity:0;}
.timer-compact.warning .mini-circle .ring-pulse{opacity:0.6;animation:pulseRing 0.8s ease-in-out infinite;}
.timer-compact.danger .mini-circle .ring-pulse{opacity:1;animation:pulseRing 0.4s ease-in-out infinite;}
@keyframes pulseRing{0%{transform:scale(1);opacity:0.6;}50%{transform:scale(1.12);opacity:0.2;}100%{transform:scale(1);opacity:0.6;}}
.timer-compact .mini-circle .timer-num{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:11px;
  font-weight:900;
  color:#363535;
  font-family:"Patrick Hand",Inter,sans-serif;
  line-height:1;
}
.timer-compact .mini-circle .timer-num.warning{color:#ff6b6b;}
.timer-compact .mini-circle .timer-num.danger{color:#ff0000;animation:numPulse 0.5s ease-in-out infinite alternate;}
@keyframes numPulse{from{transform:translate(-50%,-50%) scale(1);}to{transform:translate(-50%,-50%) scale(1.15);}}
.timer-compact .timer-status-text{
  font-size:8px;
  font-weight:700;
  color:#888;
  font-family:Inter,sans-serif;
  min-width:22px;
  white-space:nowrap;
}

/* ============================================
   QUESTION - PERFECT SIZE, CENTERED, SOFT COLOR
   ============================================ */
.question{
  font-family:"Patrick Hand",Inter,system-ui,sans-serif;
  font-size:1.7rem;
  font-weight:900;
  color:#363535;
  text-align:center;
  padding:16px 14px;
  position:relative;
  z-index:5;
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,0.88);
  border-radius:14px;
  line-height:1.35;
  min-height:70px;
  box-shadow:0 2px 12px rgba(0,0,0,0.04);
  border:1px solid rgba(123,58,246,0.06);
}
@media(max-width:480px){
  .question{
    font-size:1.4rem;
    padding:14px 12px;
    min-height:60px;
    border-radius:12px;
  }
}
@media(max-width:380px){
  .question{
    font-size:1.2rem;
    padding:12px 10px;
    min-height:50px;
  }
}
@media(min-height:800px) and (max-width:480px){
  .question{
    font-size:1.6rem;
    min-height:75px;
  }
}
@media(min-width:768px){
  .question{
    font-size:2rem;
    min-height:85px;
    padding:20px 18px;
  }
}
@media(max-height:500px) and (orientation:landscape){
  .question{
    font-size:1.1rem;
    min-height:40px;
    padding:8px 10px;
  }
}

.question.pop{animation:questionPop 0.3s ease;}
@keyframes questionPop{0%{transform:scale(1);}50%{transform:scale(1.02);}100%{transform:scale(1);}}

/* ============================================
   CHOICES - TAPPABLE
   ============================================ */
.choices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  width:100%;
  flex:1;
  align-content:center;
  min-height:70px;
}
.choice{
  min-height:48px;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  user-select:none;
  font-weight:900;
  font-size:0.9rem;
  font-family:"Patrick Hand",Inter,sans-serif;
  color:#fff;
  background:linear-gradient(-45deg,#1a9850,#2ecc71,#27ae60,#1a9850);
  background-size:400% 400%;
  border:2px solid #057d05;
  transition:all .25s ease;
  animation:gradientBG 8s ease infinite;
  padding:0 10px;
  text-align:center;
  touch-action:manipulation;
  word-break:break-word;
  line-height:1.2;
}
@keyframes gradientBG{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.choice:active{transform:scale(0.94);}
.choice.correct{border-color:#00ff00;background:linear-gradient(-45deg,#1a9850,#2ecc71);box-shadow:0 0 25px #00ff00;}
.choice.wrong{border-color:#ff0000;background:linear-gradient(-45deg,#c62828,#ef5350);animation:wrongShake 0.5s ease;}
@keyframes wrongShake{0%{transform:translateX(0);}25%{transform:translateX(-5px);}50%{transform:translateX(5px);}75%{transform:translateX(-3px);}100%{transform:translateX(0);}}

@media(max-width:480px){
  .choice{
    min-height:52px;
    font-size:0.85rem;
    padding:0 8px;
    border-width:2px;
  }
}
@media(max-width:380px){
  .choice{
    min-height:44px;
    font-size:0.75rem;
    padding:0 6px;
    border-width:2px;
  }
}
@media(min-width:768px){
  .choice{
    min-height:56px;
    font-size:1rem;
    border-width:3px;
  }
}

.feedback{
  min-height:20px;
  font-weight:800;
  text-align:center;
  color:#363535;
  padding:3px;
  font-size:0.75rem;
  flex-shrink:0;
}
@media(max-width:480px){
  .feedback{
    font-size:0.7rem;
    min-height:18px;
  }
}

.floating-emoji{
  position:fixed;
  font-size:36px;
  pointer-events:none;
  z-index:99999 !important;
  animation:floatUp 1.2s ease-out forwards;
}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(0.5) rotate(0deg);}50%{opacity:1;transform:translateY(-80px) scale(1.2) rotate(20deg);}100%{opacity:0;transform:translateY(-160px) scale(0.8) rotate(-10deg);}}

.progressWrap{
  margin-top:2px;
  display:flex;
  flex-direction:column;
  gap:2px;
  align-items:stretch;
  flex-shrink:0;
}
.progressBar{
  height:4px;
  background:rgba(0,0,0,0.05);
  border-radius:999px;
  overflow:hidden;
}
.progressFill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,rgba(123,58,246,0.7),rgba(0,229,255,0.7));
  transition:width .5s ease;
}

.final{
  position:absolute;
  inset:0;
  z-index:100 !important;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:6px;
  background:rgba(255,255,255,0.96);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-radius:12px;
  padding:16px;
  text-align:center;
  display:none;
  animation:finalPop 0.5s ease;
}
@keyframes finalPop{0%{transform:scale(0.8);opacity:0;}50%{transform:scale(1.05);}100%{transform:scale(1);opacity:1;}}
.final h2{font-family:"Patrick Hand",Inter;font-size:1.4rem;margin:2px 0;color:#0b6b3a;}
.final .score{font-weight:900;color:#363535;font-size:0.85rem;}
.final .btns{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;justify-content:center;}
.btn{
  padding:6px 14px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  font-weight:900;
  background:linear-gradient(90deg,#7b3af6,#00e5ff);
  color:#fff;
  box-shadow:0 8px 24px rgba(0,0,0,0.1);
  touch-action:manipulation;
  min-height:38px;
  min-width:60px;
  font-size:0.8rem;
  transition:transform 0.2s ease;
}
.btn:active{transform:scale(0.94);}

.confetti{
  position:fixed;
  width:5px;
  height:5px;
  top:-20px;
  pointer-events:none;
  z-index:99998 !important;
  opacity:.9;
  border-radius:2px;
  animation:confettiFall 2000ms linear forwards;
}
@keyframes confettiFall{to{transform:translateY(110vh) rotate(720deg);opacity:.9;}}

/* ============================================
   MOBILE-FRIENDLY OPTIMIZATIONS
   ============================================ */
@media(min-height:800px) and (max-width:480px){
  .question{font-size:1.6rem;min-height:75px;}
  .choice{min-height:54px;font-size:0.9rem;}
}

@media(min-width:481px) and (max-width:767px){
  .question{font-size:1.6rem;min-height:70px;}
  .choice{min-height:52px;font-size:0.9rem;}
  .header{padding:6px 10px;}
  .title{font-size:16px;}
  .logoBox{width:32px;height:32px;}
}

@media(hover:none){
  .choice:hover{transform:none;}
  .menu-item:hover{background:transparent;}
}

@supports(padding:max(0px)){
  .stage{padding:max(4px, env(safe-area-inset-top)) max(4px, env(safe-area-inset-right)) max(4px, env(safe-area-inset-bottom)) max(4px, env(safe-area-inset-left));}
}
</style>
</head>
<body>

<!-- ===== NO LANDSCAPE LOCK - REMOVED! ===== -->

<!-- BACKGROUND -->
<div class="bg"></div>
<div class="overlay"></div>

<!-- GAME STAGE -->
<div class="stage">
  <div class="book">
    <!-- HEADER - BIGGER & CLEANER -->
    <div class="header">
      <div class="leftHeader">
        <div class="logoBox"><img src="logo.png" alt="logo" onerror="this.style.display='none'"></div>
        <div class="titleWrap">
          <div class="title">Brain Rush</div>
          <div class="subtitle">Christian</div>
        </div>
        <div>
          <div class="qcount" id="qcount">1/10</div>
        </div>
      </div>
      <div class="header-right">
        <div class="streak-badge hidden" id="streakBadge">
          <span class="streak-fire">🔥</span>
          <span id="streakCount">0</span>
        </div>
        <div class="coins"><span class="coinEmoji">💰</span> <span id="headerCoins">0</span></div>
        
        <button class="menu-btn" id="menuBtn" onclick="toggleMenu()">
          ⋮
          <span class="badge" id="menuBadge">!</span>
        </button>
        
        <div class="menu-dropdown" id="menuDropdown">
          <button class="menu-item" onclick="useHint()">
            <span class="icon">💡</span>
            Hint
            <span class="count" id="hintCountDisplay">0</span>
          </button>
          <button class="menu-item" onclick="useExtraTime()">
            <span class="icon">⏰</span>
            +15s Time
            <span class="count" id="timeCountDisplay">0</span>
          </button>
          <button class="menu-item" onclick="skipQuestion()">
            <span class="icon">🔄</span>
            Skip Question
            <span class="count" id="skipCountDisplay">0</span>
          </button>
          <button class="menu-item" onclick="useDoubleCoins()">
            <span class="icon">💰</span>
            2x Coins
            <span class="count" id="doubleCountDisplay">0</span>
          </button>
          <div class="menu-divider"></div>
          <button class="menu-item" onclick="goHome()">
            <span class="icon">🏠</span>
            Home
          </button>
          <button class="menu-item danger" onclick="resetGame()">
            <span class="icon">🔄</span>
            Reset Game
          </button>
        </div>
      </div>
    </div>

    <!-- CARD -->
    <div class="card">
      <div class="timer-section">
        <div class="timer-compact" id="timerCompact">
          <div class="mini-circle">
            <svg viewBox="0 0 100 100">
              <circle class="ring-bg" cx="50" cy="50" r="42" />
              <circle class="ring-progress" id="ringProgress" cx="50" cy="50" r="42" 
                stroke-dasharray="263.89" stroke-dashoffset="0" />
              <circle class="ring-pulse" id="ringPulse" cx="50" cy="50" r="42" 
                stroke-dasharray="263.89" stroke-dashoffset="0" />
            </svg>
            <span class="timer-num" id="timerNum">15</span>
          </div>
          <span class="timer-status-text" id="timerStatusText">⏳ Go!</span>
        </div>
      </div>

      <!-- QUESTION - PERFECT SIZE, CENTERED -->
      <div class="question" id="question">Loading…</div>

      <!-- CHOICES -->
      <div class="choices" id="choices" role="list" aria-live="polite"></div>

      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="progressWrap">
        <div class="progressBar"><div class="progressFill" id="progressFill"></div></div>
      </div>

      <div id="final" class="final">
        <h2>✝️ Bible Master!</h2>
        <div class="score" id="finalScore">You answered 0 / 10 correctly</div>
        <div style="margin-top:3px;"><div class="score" id="coinSummary">Earned 0 🪙</div></div>
        <div class="btns">
          <button class="btn" id="playAgain">🔄 Play Again</button>
          <button class="btn" id="goHomeBtn">🏠 Home</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- AUDIO -->
<audio id="clickS" preload="auto"><source src="click.mp3" type="audio/mpeg"></audio>
<audio id="coinS" preload="auto"><source src="coin.mp3" type="audio/mpeg"></audio>
<audio id="cheerS" preload="auto"><source src="cheer.mp3" type="audio/mpeg"></audio>
<audio id="wrongS" preload="auto"><source src="wrong.mp3" type="audio/mpeg"></audio>
<audio id="bgMusic" loop><source src="background-music.mp3" type="audio/mpeg"></audio>

<script>
// ============================================
// BACKEND INTEGRATION
// ============================================
const API_URL = 'https://br-0p1t.onrender.com/api';
let authToken = localStorage.getItem('authToken');

// ============================================
// POWER-UP SYSTEM
// ============================================
function getShopInventory() {
  try {
    const raw = localStorage.getItem('shop_inventory');
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return parsed.map(item => {
      if (typeof item === 'string') return { id: item, qty: 1 };
      return { id: item.id, qty: item.qty || 1 };
    });
  } catch {
    return [];
  }
}

function saveShopInventory(inventory) {
  localStorage.setItem('shop_inventory', JSON.stringify(inventory));
  window.shopInventory = inventory;
}

function getPowerupQty(powerupId) {
  const inventory = getShopInventory();
  const found = inventory.find(item => item.id === powerupId);
  return found ? found.qty : 0;
}

function usePowerup(powerupId) {
  const inventory = getShopInventory();
  const found = inventory.find(item => item.id === powerupId);
  if (!found || found.qty <= 0) return false;
  found.qty--;
  const updated = inventory.filter(item => item.qty > 0);
  saveShopInventory(updated);
  return true;
}

// ============================================
// POWER-UP USAGE
// ============================================
function useHint() {
  menuOpen = false;
  document.getElementById('menuDropdown').classList.remove('open');
  
  if (!usePowerup('hint')) {
    showFeedback('💡 No hints left! Buy in Shop!', '#ff4757');
    return;
  }
  
  if (!currentSet || currentQ >= currentSet.length) return;
  
  const correctIndex = currentSet[currentQ].correct;
  const btns = choicesEl.children;
  let wrongIndices = [];
  for (let i = 0; i < btns.length; i++) {
    if (i !== correctIndex && btns[i].style.pointerEvents !== 'none') {
      wrongIndices.push(i);
    }
  }
  
  if (wrongIndices.length === 0) {
    showFeedback('🤔 No wrong answers to remove!', '#ffa94d');
    return;
  }
  
  updateMenuCounts();
  
  for (let i = 0; i < 2 && wrongIndices.length > 0; i++) {
    const idx = wrongIndices.splice(Math.floor(Math.random() * wrongIndices.length), 1)[0];
    if (btns[idx]) {
      btns[idx].style.opacity = '0.3';
      btns[idx].style.pointerEvents = 'none';
      btns[idx].style.textDecoration = 'line-through';
    }
  }
  
  showFeedback('💡 Removed 2 wrong answers!', '#7b3af6');
}

function useExtraTime() {
  menuOpen = false;
  document.getElementById('menuDropdown').classList.remove('open');
  
  if (!usePowerup('extratime')) {
    showFeedback('⏰ No extra time left!', '#ff4757');
    return;
  }
  
  updateMenuCounts();
  timeLeft += 15;
  updateTimerVisual();
  showFeedback('⏰ +15 seconds added!', '#7b3af6');
}

function skipQuestion() {
  menuOpen = false;
  document.getElementById('menuDropdown').classList.remove('open');
  
  if (!usePowerup('skip')) {
    showFeedback('🔄 No skips left!', '#ff4757');
    return;
  }
  
  if (isAnswered) return;
  isAnswered = true;
  clearInterval(timerInterval);
  
  updateMenuCounts();
  showFeedback('🔄 Skipped!', '#ffa94d');
  currentQ++;
  if (currentQ < currentSet.length) {
    setTimeout(loadQuestion, 500);
  } else {
    setTimeout(finishQuiz, 500);
  }
}

function useDoubleCoins() {
  menuOpen = false;
  document.getElementById('menuDropdown').classList.remove('open');
  
  if (!usePowerup('doublecoins')) {
    showFeedback('💰 No 2x coins left!', '#ff4757');
    return;

  document.getElementById('hintCountDisplay').textContent = getPowerupQty('hint');
  document.getElementById('hintCountDisplay').className = 'count' + (getPowerupQty('hint') <= 0 ? ' empty' : '');
  document.getElementById('timeCountDisplay').textContent = getPowerupQty('extratime');

  document.getElementById('skipCountDisplay').textContent = getPowerupQty('skip');

  document.getElementById('doubleCountDisplay').textContent = getPowerupQty('doublecoins');

async function syncCoinsToBackend(amount) {
  if (!authToken) return false;
  try {
    const response = await fetch(API_URL + '/user/update-resources', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + authToken
      },
      body: JSON.stringify({ coins: amount })
    });
    const data = await response.json();
    if (data.coins !== undefined) {
      window.dispatchEvent(new CustomEvent('coinsUpdated', { 
        detail: { coins: data.coins } 
      }));
      return true;
    }
  } catch (error) {
    console.error('❌ Coin sync error:', error);
    return false;
  }
}

// ============================================
// SHUFFLE FUNCTION
// ============================================
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

let currentSet = [], currentQ = 0, score = 0;
let totalCoins = Number(localStorage.getItem('totalCoins')) || 0;
const pointsPerQ = 10;
let timerInterval, timeLeft = 15;
let isAnswered = false;
let streak = 0;
const TOTAL_TIME = 15;
let doubleCoinsActive = false;

const questionEl = document.getElementById('question');
const choicesEl = document.getElementById('choices');

// ====== STREAK ======
function updateStreak(isCorrect){
  if(isCorrect){
    streak++;
    streakBadge.classList.remove('hidden');
    streakCount.textContent=streak;
    if(streak>=3){
      const bonus=Math.min(streak,5);
      totalCoins+=bonus;
      localStorage.setItem('totalCoins',totalCoins);
      headerCoinsEl.textContent=totalCoins;
      syncCoinsToBackend(bonus);
      showFloatingEmoji('🔥');
      const fb=document.getElementById('feedback');
      fb.textContent=`🔥 ${streak} in a row! +${bonus} bonus!`;
      fb.style.color='#ff6b6b';
      setTimeout(()=>{fb.textContent='';fb.style.color='#363535';},1500);
    }
  } else {
    streak=0;
    streakBadge.classList.add('hidden');
  }
}

function showFloatingEmoji(emoji){
  const el=document.createElement('div');
  el.className='floating-emoji';
  el.textContent=emoji;
  el.style.left=(40+Math.random()*20)+'%';
  el.style.top='40%';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1200);
}

function miniConfetti(){
  const colors=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff6bff','#ffa94d'];
  for(let i=0;i<15;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.backgroundColor=colors[Math.floor(Math.random()*colors.length)];
    c.style.left=(10+Math.random()*80)+'vw';
    c.style.animationDuration=(0.8+Math.random()*1)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),2000);
  }
}

function newSet(){
  const shuffledBank = shuffleArray([...CHRISTIAN_BANK]);
  currentSet = shuffledBank.slice(0, 10).map(q => {
    const choicesWithIndex = q.choices.map((text, idx) => ({ text, isCorrect: text === q.answer }));
    const shuffledChoices = shuffleArray([...choicesWithIndex]);
    const newCorrectIndex = shuffledChoices.findIndex(c => c.isCorrect);
    return {
      q: q.q,
      choices: shuffledChoices.map(c => c.text),
      correct: newCorrectIndex
    };
  });
  currentQ=0;score=0;
}

function loadQuestion(){
  if(currentQ>=currentSet.length){ finishQuiz(); return; }
  isAnswered=false;
  
  let current=currentSet[currentQ];
  questionEl.textContent=current.q;
  
  questionEl.classList.remove('pop');
  void questionEl.offsetWidth;
  questionEl.classList.add('pop');

  choicesEl.innerHTML='';
  const letters = ['A', 'B', 'C', 'D'];
  current.choices.forEach((c, i) => {
    const btn=document.createElement('div');
    btn.className='choice';
    btn.textContent = `${letters[i]}. ${c}`;
    btn.dataset.index = i;
    btn.addEventListener('click',(e)=>{e.preventDefault();selectAnswer(btn,i,current.correct);});
    btn.addEventListener('touchend',(e)=>{e.preventDefault();selectAnswer(btn,i,current.correct);});
    choicesEl.appendChild(btn);
  });
  qcountEl.textContent=`${currentQ+1}/10`;
  progressFill.style.width=`${(currentQ/10)*100}%`;
  startTimer();
}

function startTimer(){
  clearInterval(timerInterval);
  timeLeft=TOTAL_TIME;
  updateTimerVisual();
  timerCompact.className='timer-compact';
  timerNum.className='timer-num';
  timerStatusText.className='timer-status-text';
  timerStatusText.textContent='⏳ Go!';
  timerInterval=setInterval(()=>{
    timeLeft--;
    updateTimerVisual();
    if(timeLeft<=5 && timeLeft>3){
      timerCompact.className='timer-compact warning';
      timerNum.className='timer-num warning';
      timerStatusText.className='timer-status-text warning';
      timerStatusText.textContent='⚠️ Hurry!';
    } else if(timeLeft<=3 && timeLeft>0){
      timerCompact.className='timer-compact danger';
      timerNum.className='timer-num danger';
      timerStatusText.className='timer-status-text danger';
      timerStatusText.textContent='🔥 GO!';
    }
    if(timeLeft<=0 && !isAnswered){
      clearInterval(timerInterval);
      timerStatusText.textContent='⏰ Time!';
      timerStatusText.className='timer-status-text danger';
      timerCompact.className='timer-compact danger';
      const current=currentSet[currentQ];
      Array.from(choicesEl.children).forEach((btn,idx)=>{
        if(idx===current.correct)btn.classList.add('correct');
        btn.style.pointerEvents='none';
      });
      setTimeout(()=>{currentQ++;loadQuestion();},1500);
    }
  },1000);
}

function updateTimerVisual(){
  const percentage=(timeLeft/TOTAL_TIME)*100;
  const offset=circumference-(percentage/100)*circumference;
  ringProgress.style.strokeDashoffset=offset;
  ringPulse.style.strokeDashoffset=offset;
  timerNum.textContent=timeLeft;
  if(percentage>60){ringProgress.style.stroke='#7b3af6';}
  else if(percentage>33){ringProgress.style.stroke='#ffa94d';}
  else{ringProgress.style.stroke='#ff6b6b';}
}

function selectAnswer(btn, index, correct){
  if(isAnswered) return;
  isAnswered=true;
  if(bgMusic.paused) bgMusic.play();
  clickS.currentTime=0;clickS.play();
  clearInterval(timerInterval);
  
  if(index===correct){
    btn.classList.add('correct');
    score++;
    
    let coinsEarned = pointsPerQ;
    if (window.doubleCoinsActive) {
      coinsEarned = pointsPerQ * 2;
      window.doubleCoinsActive = false;
      showFeedback('💰 2x Coins! +' + coinsEarned, '#f59e0b');
    }
    
    totalCoins += coinsEarned;
    localStorage.setItem('totalCoins', totalCoins);
    headerCoinsEl.textContent = totalCoins;
    syncCoinsToBackend(coinsEarned);
    
    window.dispatchEvent(new CustomEvent('coinsUpdated', { 
      detail: { coins: totalCoins } 
    }));
    
    coinS.currentTime=0;coinS.play();
    coinPop(coinsEarned);
    updateStreak(true);
    const msg=correctMessages[Math.floor(Math.random()*correctMessages.length)];
    const emoji=correctEmojis[Math.floor(Math.random()*correctEmojis.length)];
    showFloatingEmoji(emoji);
    timerCompact.className='timer-compact correct';
    timerNum.className='timer-num';
    timerNum.style.color='#1fb97a';
    timerStatusText.className='timer-status-text correct';
    timerStatusText.textContent=msg;
    ringProgress.style.stroke='#1fb97a';
    const fb=document.getElementById('feedback');
    fb.textContent=`✅ ${msg}`;
    fb.style.color='#1fb97a';
    setTimeout(()=>{fb.textContent='';fb.style.color='#363535';},1000);
    miniConfetti();
    Array.from(choicesEl.children).forEach(c=>c.style.pointerEvents='none');
    setTimeout(()=>{currentQ++;loadQuestion();},800);
  } else {
    btn.classList.add('wrong');
    updateStreak(false);
    const msg=wrongMessages[Math.floor(Math.random()*wrongMessages.length)];
    const emoji=wrongEmojis[Math.floor(Math.random()*wrongEmojis.length)];
    showFloatingEmoji(emoji);
    timerCompact.className='timer-compact wrong';
    timerNum.className='timer-num';
    timerNum.style.color='#ff4757';
    timerStatusText.className='timer-status-text wrong';
    timerStatusText.textContent='😅 Try again!';
    ringProgress.style.stroke='#ff4757';
    const fb=document.getElementById('feedback');
    fb.textContent=`❌ ${msg}`;
    fb.style.color='#ff4757';
    setTimeout(()=>{fb.textContent='';fb.style.color='#363535';},1200);
    if(wrongS){wrongS.currentTime=0;wrongS.play();}
    Array.from(choicesEl.children).forEach((c,idx)=>{
      if(idx===correct)c.classList.add('correct');
      c.style.pointerEvents='none';
    });
    setTimeout(()=>{currentQ++;loadQuestion();},1500);
  }
}

// ============================================
// finishQuiz() - SEND GAME RESULT
// ============================================
function finishQuiz(){
  finalEl.style.display='flex';
  const messages=['✝️ Bible Master!','🙏 Faithful Learner!','📖 Scripture Expert!','🌟 God\'s Word Champion!','💪 Bible Scholar!'];
  document.querySelector('.final h2').textContent=`🎉 ${messages[Math.floor(Math.random()*messages.length)]}`;
  finalScoreEl.textContent=`You answered ${score} / 10 correctly!`;
  coinSummaryEl.textContent=`Earned ${score*pointsPerQ} 🪙 coins!`;
  cheerS.currentTime=0;cheerS.play();
  progressFill.style.width='100%';
  
  for(let i=0;i<60;i++){
    setTimeout(()=>{
      const c=document.createElement('div');
      c.className='confetti';
      c.style.backgroundColor=`hsl(${Math.random()*360},100%,50%)`;
      c.style.left=`${Math.random()*100}vw`;
      c.style.animationDuration=`${Math.random()*2+1.5}s`;
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),2500);
    },i*40);
  }
  
  // ==========================================
  // SEND GAME RESULT TO MAIN PAGE
  // ==========================================
  const gameData = {
    category: 'christian',
    score: score * 10,
    correct: score,
    total: 10,
    coinsEarned: score * 10
  };
  
  window.dispatchEvent(new CustomEvent('gameResult', {
    detail: gameData
  }));
  
  let gameHistory = JSON.parse(localStorage.getItem('gameHistory') || '[]');
  gameHistory.push({
    category: gameData.category,
    score: gameData.score,
    correct: gameData.correct,
    total: gameData.total,
    coinsEarned: gameData.coinsEarned,
    date: new Date().toISOString()
  });
  localStorage.setItem('gameHistory', JSON.stringify(gameHistory));
  
  console.log('✅ Game result sent to main page!', gameData);
  
  if(authToken){
    try{
      fetch(`${API_URL}/game/save-result`,{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':`Bearer ${authToken}`},
        body:JSON.stringify({category:'christian',score:score*10,questionsAnswered:currentSet.length,correctAnswers:score,timeSpent:60})
      }).then(res=>res.json()).then(data=>console.log('✅ Game saved:',data)).catch(err=>console.error('❌ Save error:',err));
    }catch(e){console.error('❌ Save error:',e);}
  }
}
