<style>
    /* GAMING APP STYLE */
    body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e) !important; font-family: "Poppins", sans-serif !important; min-height: 100vh !important; overflow-y: auto !important; }
    .card, .book, .onboarding-container, .modal { background: rgba(255,255,255,0.05) !important; backdrop-filter: blur(20px) !important; border: 1px solid rgba(255,255,255,0.1) !important; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5) !important; }
    .btn, .choice, .action-btn, .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important; border: none !important; box-shadow: 0 8px 32px rgba(102,126,234,0.4) !important; color: #fff !important; font-weight: 700 !important; }
    .btn:hover, .choice:hover { transform: translateY(-3px) !important; box-shadow: 0 12px 40px rgba(102,126,234,0.6) !important; }
    .header { background: rgba(0,0,0,0.3) !important; backdrop-filter: blur(12px) !important; border-bottom: 2px solid rgba(102,126,234,0.3) !important; }
    .title, h1, h2, .greeting { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%) !important; -webkit-background-clip: text !important; -webkit-text-fill-color: transparent !important; background-clip: text !important; }
    .category-card { background: rgba(255,255,255,0.05) !important; backdrop-filter: blur(10px) !important; border: 1px solid rgba(255,255,255,0.1) !important; border-radius: 16px !important; transition: all 0.3s ease !important; }
    .category-card:hover { transform: translateY(-10px) scale(1.02) !important; box-shadow: 0 20px 60px rgba(102,126,234,0.3) !important; border-color: #667eea !important; }
    @media (max-width: 768px) { .choice { font-size: 0.9rem !important; padding: 14px 20px !important; min-height: 52px !important; } .question { font-size: 1.2rem !important; } .category-card { min-height: 100px !important; } .category-card .emoji { font-size: 2.5rem !important; } }

/* ============================================
   PREMIUM THEME VARIABLES
   ============================================ */
:root {
  --bg-primary: #f0f2f8;
  --bg-secondary: #ffffff;
  --bg-card: rgba(255,255,255,0.92);
  --bg-card-hover: rgba(255,255,255,0.98);
  --text-primary: #1a1a2e;
  --text-secondary: #444;
  --text-muted: #888;
  --border-color: rgba(0,0,0,0.06);
  --shadow: 0 8px 40px rgba(0,0,0,0.08);
  --shadow-hover: 0 12px 56px rgba(123,58,246,0.2);
  --header-bg: rgba(255,255,255,0.92);
  --modal-bg: #ffffff;
  --input-bg: #f5f5f5;
  --input-border: #e8e8e8;
  --blob-opacity: 0.08;
  --streak-bg: rgba(0,0,0,0.04);
  --gradient-main: linear-gradient(135deg, #7b3af6, #00e5ff);
  --gradient-warm: linear-gradient(135deg, #ff6b6b, #ffa94d);
  --gradient-green: linear-gradient(135deg, #1fb97a, #22d3ee);
  --gradient-gold: linear-gradient(135deg, #f59e0b, #ff6b6b);
  --highlight-glow: rgba(123,58,246,0.3);
  --card-border: rgba(0,0,0,0.04);
  --category-glow: rgba(123,58,246,0.12);
}

body.theme-dark {
  --bg-primary: #0a0a1a;
  --bg-secondary: #141428;
  --bg-card: rgba(20,20,40,0.92);
  --bg-card-hover: rgba(30,30,60,0.95);
  --text-primary: #f0f0ff;
  --text-secondary: #b0b0d0;
  --text-muted: #707090;
  --border-color: rgba(255,255,255,0.06);

  --modal-bg: #141428;
  --input-bg: #1a1a35;
  --input-border: #2a2a50;
  --blob-opacity: 0.04;
  --streak-bg: rgba(255,255,255,0.04);
  --highlight-glow: rgba(123,58,246,0.5);
  --card-border: rgba(255,255,255,0.05);
  --category-glow: rgba(123,58,246,0.2);
}

body.theme-ocean {
  --bg-primary: #0a1628;
  --bg-secondary: #0d2137;
  --bg-card: rgba(13,33,55,0.92);
  --bg-card-hover: rgba(20,50,80,0.95);
  --text-primary: #d4f1ff;
  --text-secondary: #8bc4e8;
  --text-muted: #5a8fa8;
  --border-color: rgba(100,200,255,0.08);

  --input-bg: #0f2a45;

  --gradient-main: linear-gradient(135deg, #0088ff, #00ddff);
  --gradient-warm: linear-gradient(135deg, #ff6b6b, #ffa94d);
  --gradient-green: linear-gradient(135deg, #00d4aa, #00ffd4);
  --gradient-gold: linear-gradient(135deg, #f59e0b, #ff6b6b);
}

body.theme-forest {
  --bg-primary: #0a1a0a;
  --bg-secondary: #0f2a0f;
  --bg-card: rgba(15,42,15,0.92);
  --bg-card-hover: rgba(25,60,25,0.95);
  --text-primary: #d4f0d4;
  --text-secondary: #8bc48b;
  --text-muted: #5a8f5a;
  --border-color: rgba(100,255,100,0.06);
  --shadow: 0 8px 40px rgba(0,50,0,0.4);
  --shadow-hover: 0 12px 56px rgba(0,200,0,0.2);

  --input-bg: #1a3a1a;
  --input-border: #2a5a2a;

  --gradient-warm: linear-gradient(135deg, #ff6b6b, #ffa94d);
  --gradient-green: linear-gradient(135deg, #55efc4, #00b894);
  --gradient-gold: linear-gradient(135deg, #f59e0b, #ff6b6b);
}

body.theme-sunset {
  --bg-primary: #1a0a14;
  --bg-secondary: #2a0f1a;
  --bg-card: rgba(42,15,26,0.92);
  --bg-card-hover: rgba(60,25,40,0.95);
  --text-primary: #ffd4e0;
  --text-secondary: #e88ba8;
  --text-muted: #a85a78;
  --border-color: rgba(255,100,150,0.06);
  --shadow: 0 8px 40px rgba(50,0,20,0.4);
  --shadow-hover: 0 12px 56px rgba(200,0,100,0.2);
  --header-bg: rgba(26,10,20,0.92);
  --modal-bg: #2a0f1a;
  --input-bg: #3a1a2a;
  --input-border: #5a2a3a;
  --gradient-main: linear-gradient(135deg, #ff6b6b, #ff9f43);
  --gradient-warm: linear-gradient(135deg, #ff6b6b, #ffa94d);
  --gradient-green: linear-gradient(135deg, #55efc4, #00b894);
  --gradient-gold: linear-gradient(135deg, #f59e0b, #ff6b6b);
}

body.theme-cyber {
  --bg-primary: #0a0a14;
  --bg-secondary: #0f0f24;
  --bg-card: rgba(15,15,36,0.92);
  --bg-card-hover: rgba(25,25,50,0.95);
  --text-primary: #d4d4ff;
  --text-secondary: #8888d4;
  --text-muted: #555588;
  --border-color: rgba(0,255,200,0.06);
  --shadow: 0 8px 40px rgba(0,200,255,0.12);
  --shadow-hover: 0 12px 56px rgba(0,255,200,0.2);
  --header-bg: rgba(10,10,20,0.92);
  --modal-bg: #0f0f24;
  --input-bg: #1a1a35;
  --input-border: #2a2a50;
  --gradient-main: linear-gradient(135deg, #00ffc8, #00d4ff);
  --gradient-warm: linear-gradient(135deg, #ff6b6b, #ffa94d);
  --gradient-green: linear-gradient(135deg, #00ff88, #00ffc8);
  --gradient-gold: linear-gradient(135deg, #f59e0b, #ff6b6b);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  height:100%;
  font-family:'Poppins',sans-serif;
  background:var(--bg-primary);
  color:var(--text-primary);
  overflow-x:hidden;
  scroll-behavior:smooth;
  transition:background 0.6s ease, color 0.6s ease;
}

<!-- Onboarding Page -->
<div class="onboarding-page" id="onboardingPage">
  <div class="onboarding-container">
    <div class="onboarding-logo">
      <div class="logo-icon">🧠</div>
      <h1>Brain Rush</h1>
      <p>Challenge your brain and earn rewards!</p>
    </div>
    <label>Choose Your Username</label>
    <input type="text" id="onboardingUsername" placeholder="Enter username (2-20 characters)" maxlength="20" />
    <label>Choose Your Avatar</label>

    <button class="btn-primary" id="onboardingBtn" onclick="completeOnboarding()">🚀 Start Brain Rush!</button>

  </div>

<!-- Header -->
<header class="header" id="mainHeader">
  <div class="header-left">
    <a href="#" class="logo"><span>🧠 Brain Rush</span></a>
  </div>
  <div class="header-right">
    <button class="profile-btn" onclick="openProfile()">
      <span class="profile-avatar-mini" id="headerProfileAvatar">👤</span>
    </button>
    <div class="level-badge">⭐ <span id="levelDisplay">Lv.1</span></div>
    <div class="badge-item">💰 <span class="value" id="coinCount">0</span></div>
    <div class="badge-item">💎 <span class="value diamond" id="diamondCount">0</span></div>
    <div class="badge-item">⚡ <span class="value" id="xpCount" style="color:#4ade80;">0</span></div>
    <div class="streak-badge-header" id="streakBadge" style="display:none;">🔥 <span id="streakDisplay">0</span></div>
    <button class="music-btn" id="musicToggle">🔊</button>
    <button class="settings-btn" onclick="openSettings()">⚙️</button>
  </div>
</header>

<!-- Main Content -->
<main class="main" id="mainContent">
  <section class="hero-section">
    <h1 class="greeting" id="greetingText">🧠 Welcome to Brain Rush!</h1>
    <p class="sub-greeting" id="subGreeting">Challenge your brain and earn rewards!</p>
    <div class="hero-stats">
      <div class="stat">🎯 Games: <span id="gamesPlayed">0</span></div>
      <div class="stat">🏆 Best: <span id="bestCategory">-</span></div>
      <div class="stat">📊 Accuracy: <span id="accuracyDisplay">0%</span></div>
    </div>
  </section>

  <div class="quick-actions">
    <button class="action-btn primary" onclick="claimMysteryBox()">🎁 Mystery Box</button>
    <button class="action-btn warm" onclick="openWheel()">🎡 Daily Wheel</button>
    <button class="action-btn green" onclick="openRoadmap()">🗺️ Roadmap</button>
    <button class="action-btn shop" onclick="openShop()">🏪 Shop</button>
    <button class="action-btn leaderboard" onclick="openLeaderboard()">🏆 Leaderboard</button>
  </div>

  <div class="streak-wrap">
    <div class="streak-info">
      <span class="streak-label">🔥 Daily Streak</span>
      <span class="streak-count" id="streakCountText">0 days</span>
    </div>
    <div class="streak-bar"><div class="streak-fill" id="streakFill"></div></div>
    <div class="streak-info">
      <span class="streak-next" id="streakNextMilestone"></span>
    </div>
  </div>

  <section class="categories-section">
    <div class="section-title">📚 <span>Choose Your Challenge</span></div>
    <div class="categories-grid">
      <a href="cars.html?category=cars" class="category-card"><span class="emoji">🚗</span><span class="name">Cars</span><span class="play-count" id="playCount-cars">0 played</span></a>
      <a href="logic.html?category=math" class="category-card"><span class="emoji">🧮</span><span class="name">Math</span><span class="play-count" id="playCount-math">0 played</span></a>
      <a href="history.html?category=history" class="category-card"><span class="emoji">📜</span><span class="name">History</span><span class="play-count" id="playCount-history">0 played</span></a>

      <a href="science.html?category=science" class="category-card"><span class="emoji">🔬</span><span class="name">Science</span><span class="play-count" id="playCount-science">0 played</span></a>
      <a href="geography.html?category=geography" class="category-card"><span class="emoji">🌍</span><span class="name">Geography</span><span class="play-count" id="playCount-geography">0 played</span></a>
      <a href="countries.html?category=countries" class="category-card"><span class="emoji">🏳️</span><span class="name">Countries</span><span class="play-count" id="playCount-countries">0 played</span></a>
      <a href="logos.html?category=logos" class="category-card"><span class="emoji">🏷️</span><span class="name">Logos</span><span class="play-count" id="playCount-logos">0 played</span></a>
      <a href="food.html?category=food" class="category-card"><span class="emoji">🍕</span><span class="name">Food</span><span class="play-count" id="playCount-food">0 played</span></a>
      <a href="teams.html?category=teams" class="category-card"><span class="emoji">⚽</span><span class="name">Teams</span><span class="play-count" id="playCount-teams">0 played</span></a>
      <a href="cartoons.html?category=cartoons" class="category-card"><span class="emoji">🎬</span><span class="name">Cartoons</span><span class="play-count" id="playCount-cartoons">0 played</span></a>
    </div>
  </section>

  <div class="footer">© 2025 Brain Rush | Premium Edition</div>
</main>

<div class="modal-overlay" id="profileModal">

    <div class="modal-body profile-content" id="profileContent"></div>
  </div>
</div>

<!-- SETTINGS MODAL - FIXED WITH AVATAR -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal" style="max-width:600px;">
    <div class="modal-header"><h2>⚙️ Settings</h2><button class="close-btn" onclick="closeSettings()">✕</button></div>
    <div class="modal-body" id="settingsContent">
      <!-- ===== USER INFO ===== -->
      <div style="display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg-card);border-radius:16px;margin-bottom:16px;border:1px solid var(--border-color);">
        <div style="font-size:3rem;width:60px;height:60px;display:flex;align-items:center;justify-content:center;background:var(--gradient-main);border-radius:50%;color:#fff;" id="settingsAvatarDisplay">👤</div>
        <div>
          <div style="font-weight:700;font-size:1.1rem;color:var(--text-primary);" id="settingsUsernameDisplay">User</div>
          <div style="display:flex;gap:12px;font-size:0.75rem;color:var(--text-muted);margin-top:4px;">
            <span>💰 <span id="settingsCoinsDisplay">0</span></span>
            <span>💎 <span id="settingsDiamondsDisplay">0</span></span>
            <span>🔥 <span id="settingsStreakDisplay">0</span></span>
          </div>
        </div>
      </div>
      
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;">
        <div style="background:var(--input-bg);padding:10px;border-radius:12px;text-align:center;">
          <div style="font-size:1.2rem;font-weight:800;color:#f59e0b;" id="settingsCoins">0</div>
          <div style="font-size:0.6rem;color:var(--text-muted);">Coins</div>
        </div>
        <div style="background:var(--input-bg);padding:10px;border-radius:12px;text-align:center;">
          <div style="font-size:1.2rem;font-weight:800;color:#7b3af6;" id="settingsDiamonds">0</div>
          <div style="font-size:0.6rem;color:var(--text-muted);">Diamonds</div>
        </div>
        <div style="background:var(--input-bg);padding:10px;border-radius:12px;text-align:center;">
          <div style="font-size:1.2rem;font-weight:800;color:#ff6b6b;" id="settingsStreak">0</div>
          <div style="font-size:0.6rem;color:var(--text-muted);">Streak</div>
        </div>
      </div>
      
      <div style="margin-bottom:16px;">
        <h3 style="font-size:0.85rem;font-weight:700;color:var(--text-primary);margin-bottom:8px;">🎨 Choose Theme</h3>
        <div class="theme-selector-grid" id="settingsThemeGrid"></div>
      </div>
      
      <div style="height:1px;background:var(--border-color);margin:16px 0;"></div>
      
      <div style="margin-bottom:16px;">
        <h3 style="font-size:0.85rem;font-weight:700;color:var(--text-primary);margin-bottom:8px;">⚙️ Preferences</h3>
        
        <div class="settings-toggle">
          <div><div class="toggle-label">🔊 Sound Effects</div></div>
          <label class="switch">
            <input type="checkbox" id="soundToggle" checked onchange="toggleSound()">
            <span class="slider"></span>
          </label>
        </div>
        
        <div class="settings-toggle">
          <div><div class="toggle-label">🎵 Background Music</div></div>
          <label class="switch">
            <input type="checkbox" id="musicToggleSettings" checked onchange="toggleMusic()">
            <span class="slider"></span>
          </label>
        </div>
      </div>
      
      <div style="height:1px;background:var(--border-color);margin:16px 0;"></div>
      
      <div style="margin-bottom:16px;">
        <h3 style="font-size:0.85rem;font-weight:700;color:var(--text-primary);margin-bottom:8px;">💾 Data</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn-secondary" onclick="exportData()" style="font-size:0.75rem;padding:10px 16px;">📤 Export</button>
          <button class="btn-secondary" onclick="importData()" style="font-size:0.75rem;padding:10px 16px;">📥 Import</button>
          <button class="btn-secondary" onclick="resetData()" style="font-size:0.75rem;padding:10px 16px;color:#ff4757;">🔄 Reset</button>
        </div>
      </div>
      
      <div style="text-align:center;padding:8px 0;">
        <p style="font-size:0.6rem;color:var(--text-muted);">Brain Rush Premium v2.0 • 2026</p>
      </div>
    </div>
  </div>
</div>

<!-- LEADERBOARD MODAL -->
<div class="modal-overlay" id="leaderboardModal">

<!-- SHOP MODAL -->
<div class="modal-overlay" id="shopModal">
  <div class="modal" style="max-width:650px;">
    <div class="modal-header"><h2>🏪 Premium Shop</h2><button class="close-btn" onclick="closeShop()">✕</button></div>
    <div class="modal-body">
      <div class="shop-balance">
        <div class="bal-item">💰 Coins: <span id="shopCoins">0</span></div>

      <div class="shop-tabs">
        <button class="shop-tab active" onclick="switchShopTab('themes')">🎨 Themes</button>
        <button class="shop-tab" onclick="switchShopTab('avatars')">🖼️ Avatars</button>
        <button class="shop-tab" onclick="switchShopTab('powerups')">⚡ Power-ups</button>
        <button class="shop-tab" onclick="switchShopTab('cosmetics')">✨ Cosmetics</button>
        <button class="shop-tab" onclick="switchShopTab('passes')">🎫 Passes</button>
      </div>
      <div id="shopItemsContainer"></div>
      <button class="btn-primary" onclick="closeShop()" style="margin-top:12px;">Close</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="wheelModal">
  <div class="modal" style="max-width:480px;">
    <div class="modal-header"><h2>🎡 Daily Wheel</h2><button class="close-btn" onclick="closeWheel()">✕</button></div>
    <div class="modal-body" style="display:flex;flex-direction:column;align-items:center;">
      <canvas id="wheelCanvas" width="360" height="360" style="border-radius:50%;box-shadow:0 0 30px rgba(123,58,246,0.2);max-width:100%;"></canvas>
      <p style="margin-top:12px;font-size:0.8rem;color:var(--text-muted);">Click the wheel to spin!</p>
    </div>

<script>
// ==========================================
// CONFIGURATION
// ==========================================
const API_URL = 'https://br-zdvs.onrender.com/api';

// ==========================================
// AVATARS - CUSTOMIZED
// ==========================================
const FREE_AVATARS = [
  { id: 'default', emoji: '👤', name: 'Default' },
  { id: 'pirate', emoji: '🏴‍☠️', name: 'Pirate' },
  { id: 'wizard', emoji: '🧙', name: 'Wizard' },
  { id: 'astronaut', emoji: '👨‍🚀', name: 'Astronaut' },
  { id: 'superhero', emoji: '🦸', name: 'Superhero' },
  { id: 'ninja', emoji: '🥷', name: 'Ninja' },
  { id: 'robot', emoji: '🤖', name: 'Robot' },
  { id: 'alien', emoji: '👽', name: 'Alien' }
];

const LOCKED_AVATARS = [
  { id: 'crown', emoji: '👑', name: 'King/Queen', cost: 25, currency: 'diamond' },
  { id: 'fire', emoji: '🔥', name: 'Fire Spirit', cost: 30, currency: 'diamond' },
  { id: 'ghost', emoji: '👻', name: 'Ghost', cost: 20, currency: 'diamond' },
  { id: 'dragon', emoji: '🐉', name: 'Dragon', cost: 40, currency: 'diamond' },
  { id: 'unicorn', emoji: '🦄', name: 'Unicorn', cost: 35, currency: 'diamond' },
  { id: 'phoenix', emoji: '🐦‍🔥', name: 'Phoenix', cost: 50, currency: 'diamond' }
];

const ALL_AVATARS = [...FREE_AVATARS, ...LOCKED_AVATARS];

// ==========================================
// SHOP DATA
// ==========================================
const SHOP_DATA = {
  themes: [
    { id: 'dark', emoji: '🌙', name: 'Dark Theme', desc: 'Sleek dark mode with purple neon glow', cost: 100, currency: 'coin' },
    { id: 'ocean', emoji: '🌊', name: 'Ocean Theme', desc: 'Deep blue ocean vibes with cyan highlights', cost: 150, currency: 'coin' },
    { id: 'forest', emoji: '🌿', name: 'Forest Theme', desc: 'Calming green nature with emerald tones', cost: 150, currency: 'coin' },
    { id: 'sunset', emoji: '🌅', name: 'Sunset Theme', desc: 'Warm golden and pink sunset hues', cost: 200, currency: 'diamond' },
    { id: 'cyber', emoji: '💠', name: 'Cyber Theme', desc: 'Neon cyberpunk with cyan and pink', cost: 250, currency: 'diamond' }
  ],
  avatars: LOCKED_AVATARS,
  powerups: [
    { id: 'hint', emoji: '💡', name: 'Hint', desc: 'Remove 2 wrong answers', cost: 20, currency: 'coin', stackable: true },
    { id: 'extratime', emoji: '⏰', name: 'Extra Time', desc: '+15 seconds on next question', cost: 30, currency: 'coin', stackable: true },
    { id: 'skip', emoji: '🔄', name: 'Skip Question', desc: 'Skip any question without penalty', cost: 50, currency: 'coin', stackable: true },
    { id: 'doublecoins', emoji: '💰', name: '2x Coins', desc: 'Double coins for 1 question', cost: 75, currency: 'coin', stackable: true },
    { id: 'streakshield', emoji: '🛡️', name: 'Streak Shield', desc: 'Protect your streak for 1 day', cost: 100, currency: 'coin', stackable: true }
  ],
  cosmetics: [
    { id: 'gold_frame', emoji: '👑', name: 'Gold Frame', desc: 'Premium gold frame for avatar', cost: 20, currency: 'diamond' },
    { id: 'rainbow_badge', emoji: '🌈', name: 'Rainbow Badge', desc: 'Colorful animated badge', cost: 30, currency: 'diamond' },
    { id: 'sparkle_effect', emoji: '✨', name: 'Sparkle Effect', desc: 'Sparkle effect on avatar', cost: 15, currency: 'diamond' }
  ],
  passes: [
    { id: 'vip_pass', emoji: '💎', name: 'VIP Pass', desc: 'VIP badge + early access for 1 week', cost: 100, currency: 'diamond' },
    { id: 'tournament_entry', emoji: '🏆', name: 'Tournament Entry', desc: 'Enter weekly tournament', cost: 200, currency: 'coin' },
    { id: 'double_xp', emoji: '🚀', name: 'Double XP Pass', desc: '2x XP for 24 hours', cost: 50, currency: 'diamond' }
  ]
};

// ==========================================
// USER STATE
// ==========================================
let username = localStorage.getItem('username') || '';
let equippedAvatar = localStorage.getItem('equippedAvatar') || 'default';
let ownedAvatars = JSON.parse(localStorage.getItem('ownedAvatars') || '["default"]');
let ownedThemes = JSON.parse(localStorage.getItem('ownedThemes') || '[]');
let activeTheme = localStorage.getItem('activeTheme') || 'default';
let coins = parseInt(localStorage.getItem('totalCoins') || '100');
let diamonds = parseInt(localStorage.getItem('totalDiamonds') || '5');
let streakDays = parseInt(localStorage.getItem('streakDays') || '0');
let inventory = JSON.parse(localStorage.getItem('shop_inventory') || '[]');
let isOnboarded = localStorage.getItem('isOnboarded') === 'true';
let xp = parseInt(localStorage.getItem('totalXP') || '0');
let level = parseInt(localStorage.getItem('userLevel') || '1');
let gameHistory = JSON.parse(localStorage.getItem('gameHistory') || '[]');
let authToken = localStorage.getItem('authToken') || '';

// ==========================================
// HELPER FUNCTIONS
// ==========================================
function getAvatarEmoji(id) {
  const av = ALL_AVATARS.find(a => a.id === id);
  return av ? av.emoji : '👤';
}
function getAvatarName(id) {
  const av = ALL_AVATARS.find(a => a.id === id);
  return av ? av.name : 'Default';
}
function getThemeEmoji(id) {
  const theme = SHOP_DATA.themes.find(t => t.id === id);
  return theme ? theme.emoji : '🎨';
}
function getThemeName(id) {
  const theme = SHOP_DATA.themes.find(t => t.id === id);
  return theme ? theme.name : 'Theme';
}
function getItemQty(itemId) {
  const entry = inventory.find(i => i.id === itemId || i === itemId);
  if (!entry) return 0;
  if (typeof entry === 'string') return 1;
  return entry.qty || 1;
}
function countInventoryItems() {
  let total = 0;
  inventory.forEach(item => {
    if (typeof item === 'string') total += 1;
    else total += (item.qty || 1);
  });
  return total;
}
function isThemeOwned(themeId) { return ownedThemes.includes(themeId); }
function isAvatarOwned(avatarId) { return ownedAvatars.includes(avatarId); }

// ==========================================
// GAME STATS - FIXED ACCURACY
// ==========================================
function updateGameStats() {
  document.getElementById('gamesPlayed').textContent = gameHistory.length;
  
  let totalCorrect = 0, totalQuestions = 0;
  gameHistory.forEach(g => { 
    totalCorrect += (g.correct || 0); 
    totalQuestions += (g.total || 0); 
  });
  
  const accuracy = totalQuestions > 0 ? Math.round((totalCorrect / totalQuestions) * 100) : 0;
  document.getElementById('accuracyDisplay').textContent = accuracy + '%';
  
  // Best category (most played)
  if (gameHistory.length > 0) {
    const catCount = {};
    gameHistory.forEach(g => { 
      const cat = g.category || 'unknown'; 
      catCount[cat] = (catCount[cat] || 0) + 1; 
    });
    let bestCat = '-', maxCount = 0;
    for (const [cat, count] of Object.entries(catCount)) {
      if (count > maxCount) { 
        maxCount = count; 
        bestCat = cat.charAt(0).toUpperCase() + cat.slice(1); 
      }
    }
    document.getElementById('bestCategory').textContent = bestCat;
  }
  
  // Update play counts
  const categories = ['math','history','riddle','science','geography','countries','cars','logos','food','teams','cartoons'];
  categories.forEach(cat => {
    const count = gameHistory.filter(g => g.category === cat).length;
    const el = document.getElementById('playCount-' + cat);
    if (el) el.textContent = count + ' played';
  });
}

// ==========================================
// THEME FUNCTIONS
// ==========================================
function applyTheme(themeId) {
  activeTheme = themeId;
  localStorage.setItem('activeTheme', themeId);
  document.body.className = '';
  if (themeId !== 'default') document.body.classList.add('theme-' + themeId);
  updateSettingsThemeSelector();
  showRewardPopup('🎨 ' + getThemeName(themeId) + ' applied!');
  syncToServer();
}

function buyTheme(themeId) {
  const theme = SHOP_DATA.themes.find(t => t.id === themeId);
  if (!theme) return;
  if (isThemeOwned(themeId)) { applyTheme(themeId); return; }
  const currency = theme.currency === 'coin' ? coins : diamonds;
  if (currency < theme.cost) { alert('❌ Not enough ' + theme.currency + 's!'); return; }
  if (theme.currency === 'coin') { coins -= theme.cost; localStorage.setItem('totalCoins', coins); }
  else { diamonds -= theme.cost; localStorage.setItem('totalDiamonds', diamonds); }
  ownedThemes.push(themeId);
  localStorage.setItem('ownedThemes', JSON.stringify(ownedThemes));
  applyTheme(themeId);
  updateAllDisplays();
  renderShopItems(currentShopTab);
  updateSettingsThemeSelector();
  showRewardPopup('🎨 Purchased ' + theme.emoji + ' ' + theme.name + '!');
  spawnConfetti(20);
  syncToServer();
}

function updateSettingsThemeSelector() {
  const container = document.getElementById('settingsThemeGrid');
  if (!container) return;
  const allThemes = [
    { id: 'default', emoji: '☀️', name: 'Default', color: '#f0f2f8' },
    { id: 'dark', emoji: '🌙', name: 'Dark', color: '#0a0a1a' },
    { id: 'ocean', emoji: '🌊', name: 'Ocean', color: '#0a1628' },
    { id: 'forest', emoji: '🌿', name: 'Forest', color: '#0a1a0a' },
    { id: 'sunset', emoji: '🌅', name: 'Sunset', color: '#1a0a14' },
    { id: 'cyber', emoji: '💠', name: 'Cyber', color: '#0a0a14' }
  ];
  container.innerHTML = allThemes.map(theme => {
    const owned = theme.id === 'default' || isThemeOwned(theme.id);
    const active = activeTheme === theme.id;
    return `<div class="theme-card ${active ? 'active' : ''}" 
                 onclick="${owned ? "applyTheme('"+theme.id+"')" : "openShop();setTimeout(()=>switchShopTab('themes'),300);"}">
      <div class="theme-preview-box ${theme.id}" style="background:${theme.color};color:#fff;">${theme.emoji}</div>
      <div class="theme-name">${theme.name}</div>
      <div class="theme-status">${active ? '✅ Active' : (owned ? 'Owned' : '🔒')}</div>
    </div>`;
  }).join('');
}

// ==========================================
// SYNC TO SERVER
// ==========================================
async function syncToServer() {
  if (!authToken || !username) return;
  try {
    await fetch(`${API_URL}/user/${username}/update`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${authToken}`
      },
      body: JSON.stringify({
        coins, diamonds, xp, level,
        avatar: equippedAvatar,
        activeTheme: activeTheme,
        ownedAvatars: ownedAvatars,
        ownedThemes: ownedThemes,
        inventory: inventory
      })
    });
  } catch (error) {
    console.log('⚠️ Sync failed');
  }
}

// ==========================================
// ONBOARDING
// ==========================================
function showOnboardingPage() {
  document.getElementById('onboardingPage').style.display = 'flex';
  document.getElementById('mainContent').style.display = 'none';
  document.getElementById('mainHeader').style.display = 'none';
  document.getElementById('aiChatToggle').style.display = 'none';
  const grid = document.getElementById('avatarSelectGrid');
  grid.innerHTML = FREE_AVATARS.map(av => `
    <div class="avatar-option ${equippedAvatar === av.id ? 'active' : ''}" onclick="selectAvatar('${av.id}')" id="avatar-${av.id}">
      <span class="avatar-emoji">${av.emoji}</span>
      <span class="avatar-name">${av.name}</span>
    </div>
  `).join('');
  if (username) document.getElementById('onboardingUsername').value = username;
}

function selectAvatar(id) {
  equippedAvatar = id;
  document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('active'));
  const selected = document.getElementById('avatar-' + id);
  if (selected) selected.classList.add('active');
}

async function completeOnboarding() {
  const nameInput = document.getElementById('onboardingUsername');
  const newUsername = nameInput.value.trim();
  const status = document.getElementById('onboardingStatus');
  const btn = document.getElementById('onboardingBtn');
  
  if (!newUsername || newUsername.length < 2) {
    status.textContent = '❌ Please enter a username (2-20 characters)';
    status.style.color = '#ff4757';
    return;
  }
  
  btn.disabled = true;
  status.textContent = '⏳ Creating account...';
  
  try {
    const response = await fetch(`${API_URL}/auth/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        username: newUsername, 
        email: `${newUsername}@brainrush.game`,
        password: 'default123' 
      })
    });
    
    const data = await response.json();
    
    if (data.success) {
      username = newUsername;
      authToken = data.token;
      localStorage.setItem('username', username);
      localStorage.setItem('authToken', authToken);
      localStorage.setItem('equippedAvatar', equippedAvatar);
      localStorage.setItem('isOnboarded', 'true');
      
      coins = data.user.coins || 100;
      diamonds = data.user.diamonds || 5;
      streakDays = data.user.streakDays || 0;
      xp = data.user.xp || 0;
      level = data.user.level || 1;
      
      localStorage.setItem('totalCoins', coins);
      localStorage.setItem('totalDiamonds', diamonds);
      localStorage.setItem('streakDays', streakDays);
      localStorage.setItem('totalXP', xp);
      localStorage.setItem('userLevel', level);
      
      status.textContent = '✅ Welcome ' + username + '!';
      status.style.color = '#1fb97a';
      
      setTimeout(() => {
        showGamePage();
        initGame();
        updateAllDisplays();
        showRewardPopup('🎉 Welcome to Brain Rush, ' + username + '!');
        spawnConfetti(40);
        btn.disabled = false;
      }, 500);
    } else {
      status.textContent = '❌ ' + (data.error || 'Registration failed');
      status.style.color = '#ff4757';
      btn.disabled = false;
    }
  } catch (error) {
    status.textContent = '⚠️ Server not available. Playing offline mode.';
    status.style.color = '#f59e0b';
    
    username = newUsername;
    localStorage.setItem('username', username);
    localStorage.setItem('equippedAvatar', equippedAvatar);
    localStorage.setItem('isOnboarded', 'true');
    coins = 100;
    diamonds = 5;
    streakDays = 1;
    localStorage.setItem('totalCoins', '100');
    localStorage.setItem('totalDiamonds', '5');
    localStorage.setItem('streakDays', '1');
    
    setTimeout(() => {
      showGamePage();
      initGame();
      updateAllDisplays();
      btn.disabled = false;
    }, 500);
  }
}

function showGamePage() {
  document.getElementById('onboardingPage').style.display = 'none';
  document.getElementById('mainContent').style.display = 'block';
  document.getElementById('mainHeader').style.display = 'flex';
  document.getElementById('aiChatToggle').style.display = 'block';
}

// ==========================================
// REFRESH USER DATA
// ==========================================
async function refreshUserData() {
  if (!authToken) return false;
  try {
    const response = await fetch(`${API_URL}/auth/verify`, {
      headers: { 'Authorization': `Bearer ${authToken}` }
    });
    const data = await response.json();
    if (data.valid) {
      const user = data.user;
      coins = user.coins || 0;
      diamonds = user.diamonds || 0;
      xp = user.xp || 0;
      level = user.level || 1;
      streakDays = user.streakDays || 0;
      equippedAvatar = user.equippedAvatar || 'default';
      ownedAvatars = user.ownedAvatars || ['default'];
      ownedThemes = user.ownedThemes || [];
      
      localStorage.setItem('totalCoins', coins);
      localStorage.setItem('totalDiamonds', diamonds);
      localStorage.setItem('totalXP', xp);
      localStorage.setItem('userLevel', level);
      localStorage.setItem('streakDays', streakDays);
      localStorage.setItem('equippedAvatar', equippedAvatar);
      localStorage.setItem('ownedAvatars', JSON.stringify(ownedAvatars));
      localStorage.setItem('ownedThemes', JSON.stringify(ownedThemes));
      
      updateAllDisplays();
      return true;
    }
    return false;
  } catch (error) {
    return false;
  }
}

// ==========================================
// SHOP FUNCTIONS
// ==========================================
let currentShopTab = 'themes';

function openShop() {
  document.getElementById('shopModal').classList.add('active');
  updateShopUI();
  renderShopItems(currentShopTab);
}
function closeShop() { document.getElementById('shopModal').classList.remove('active'); }

function switchShopTab(tab) {
  currentShopTab = tab;
  document.querySelectorAll('.shop-tab').forEach(el => el.classList.remove('active'));
  const tabs = document.querySelectorAll('.shop-tab');
  const map = { themes: 0, avatars: 1, powerups: 2, cosmetics: 3, passes: 4 };
  if (tabs[map[tab]]) { tabs[map[tab]].classList.add('active'); }
  renderShopItems(tab);
}

function updateShopUI() {
  document.getElementById('shopCoins').textContent = coins;
  document.getElementById('shopDiamonds').textContent = diamonds;
  document.getElementById('shopInventory').textContent = countInventoryItems();
}

function renderShopItems(tab) {
  const container = document.getElementById('shopItemsContainer');
  const items = SHOP_DATA[tab] || [];
  if (items.length === 0) { 
    container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:20px;">No items in this category.</p>'; 
    return; 
  }
  
  let html = '';
  const titles = { themes: '🎨 Themes', avatars: '🖼️ Avatars', powerups: '⚡ Power-ups', cosmetics: '✨ Cosmetics', passes: '🎫 Passes' };
  html += `<div class="shop-category-title">${titles[tab] || ''}</div>`;
  
  items.forEach(item => {
    const isOwned = tab === 'themes' ? isThemeOwned(item.id) : 
                    tab === 'avatars' ? isAvatarOwned(item.id) : 
                    getItemQty(item.id) > 0;
    const isEquipped = tab === 'themes' ? activeTheme === item.id : 
                       tab === 'avatars' ? equippedAvatar === item.id : false;
    const hasCurrency = item.currency === 'coin' ? coins >= item.cost : diamonds >= item.cost;
    
    const displayEmoji = item.emoji || '🎁';
    const displayName = item.name || 'Item';
    
    let actionHtml = '';
    
    if (tab === 'themes') {
      const themeColors = { dark: '#0a0a1a', ocean: '#0a1628', forest: '#0a1a0a', sunset: '#1a0a14', cyber: '#0a0a14' };
      const previewStyle = `background:${themeColors[item.id] || '#1a1a2e'}; color:#fff; display:flex; align-items:center; justify-content:center; font-size:1.5rem; border-radius:12px; width:50px; height:50px;`;
      
      if (isOwned) {
        actionHtml = `<button class="btn-equip" onclick="applyTheme('${item.id}')" ${isEquipped ? 'disabled' : ''}>${isEquipped ? '✅ Active' : 'Apply'}</button>`;
      } else {
        actionHtml = `<span class="price">${item.currency === 'coin' ? '💰' : '💎'} ${item.cost}</span>
                      <button class="btn-buy ${item.currency}" onclick="buyTheme('${item.id}')" ${!hasCurrency ? 'disabled' : ''}>
                        ${!hasCurrency ? '❌' : 'Buy'}
                      </button>`;
      }
      
      html += `<div class="shop-item-card">
        <div class="theme-preview" style="${previewStyle}">${displayEmoji}</div>
        <div class="item-info">
          <h4>${displayEmoji} ${displayName}</h4>
          <p>${item.desc}</p>
          ${isEquipped ? '<span class="badge equipped">⭐ Active</span>' : ''}
        </div>
        <div class="item-action">${actionHtml}</div>
      </div>`;
    } else {
      if (isOwned) {
        actionHtml = `<span class="owned-tag">✅ Owned</span>`;
      } else {
        actionHtml = `<span class="price">${item.currency === 'coin' ? '💰' : '💎'} ${item.cost}</span>
                      <button class="btn-buy ${item.currency}" onclick="buyItem('${item.id}')" ${!hasCurrency ? 'disabled' : ''}>
                        ${!hasCurrency ? '❌' : 'Buy'}
                      </button>`;
      }
      
      html += `<div class="shop-item-card">
        <div class="item-icon" style="font-size:2rem;">${displayEmoji}</div>
        <div class="item-info">
          <h4>${displayEmoji} ${displayName}</h4>
          <p>${item.desc}</p>
          ${isOwned ? '<span class="badge owned">✅ Owned</span>' : ''}
        </div>
        <div class="item-action">${actionHtml}</div>
      </div>`;
    }
  });
  container.innerHTML = html;
}

function buyItem(itemId) {
  let item = null;
  for (let cat in SHOP_DATA) {
    const found = SHOP_DATA[cat].find(i => i.id === itemId);
    if (found) { item = found; break; }
  }
  if (!item) { alert('Item not found!'); return; }
  const isStackable = item.stackable === true;
  const alreadyOwned = isStackable ? false : getItemQty(itemId) > 0;
  if (alreadyOwned) { alert('You already own this!'); return; }
  const currency = item.currency === 'coin' ? coins : diamonds;
  if (currency < item.cost) { alert(`❌ Not enough ${item.currency}s!`); return; }
  if (item.currency === 'coin') { coins -= item.cost; localStorage.setItem('totalCoins', coins); }
  else { diamonds -= item.cost; localStorage.setItem('totalDiamonds', diamonds); }
  if (isStackable) {
    const existing = inventory.find(i => (i.id || i) === itemId);
    if (existing) {
      if (typeof existing === 'string') { const idx = inventory.indexOf(existing); inventory[idx] = { id: itemId, qty: 2 }; }
      else { existing.qty = (existing.qty || 1) + 1; }
    } else { inventory.push({ id: itemId, qty: 1 }); }
  } else { inventory.push(itemId); }
  localStorage.setItem('shop_inventory', JSON.stringify(inventory));
  updateAllDisplays(); updateShopUI(); renderShopItems(currentShopTab);
  showRewardPopup('✅ Purchased ' + (item.emoji || '') + ' ' + item.name + '!');
  spawnConfetti(20);
  syncToServer();
}

function buyAvatar(avatarId) {
  const avatar = LOCKED_AVATARS.find(a => a.id === avatarId);
  if (!avatar) return;
  if (isAvatarOwned(avatarId)) { equipAvatar(avatarId); return; }
  const currency = avatar.currency === 'coin' ? coins : diamonds;
  if (currency < avatar.cost) { alert(`❌ Not enough ${avatar.currency}s!`); return; }
  if (avatar.currency === 'coin') { coins -= avatar.cost; localStorage.setItem('totalCoins', coins); }
  else { diamonds -= avatar.cost; localStorage.setItem('totalDiamonds', diamonds); }
  ownedAvatars.push(avatarId);
  localStorage.setItem('ownedAvatars', JSON.stringify(ownedAvatars));
  equipAvatar(avatarId);
  updateAllDisplays(); updateShopUI(); renderShopItems(currentShopTab);
  showRewardPopup('🖼️ Avatar: ' + avatar.emoji + ' ' + avatar.name);
  spawnConfetti(20);
  syncToServer();
}

function equipAvatar(avatarId) {
  if (!isAvatarOwned(avatarId)) { alert('❌ You don\'t own this avatar!'); return; }
  equippedAvatar = avatarId;
  localStorage.setItem('equippedAvatar', avatarId);
  updateAllDisplays(); renderShopItems(currentShopTab);
  showRewardPopup('🖼️ Avatar equipped: ' + getAvatarEmoji(avatarId) + ' ' + getAvatarName(avatarId));
  syncToServer();
}

function updateAllDisplays() {
  document.getElementById('coinCount').textContent = coins;
  document.getElementById('diamondCount').textContent = diamonds;
  document.getElementById('greetingText').textContent = '👋 Welcome back, ' + username + '!';
  document.getElementById('xpCount').textContent = xp;

  document.getElementById('headerProfileAvatar').textContent = avatar;
  document.getElementById('shopCoins').textContent = coins;

  document.getElementById('streakDisplay').textContent = streakDays;
  document.getElementById('streakCountText').textContent = streakDays + ' days';
  document.getElementById('streakBadge').style.display = streakDays > 0 ? 'flex' : 'none';
  
  // Update settings if open
  if (document.getElementById('settingsModal').classList.contains('active')) {
    renderSettings();
  }
  
  // Update profile if open
  if (document.getElementById('profileModal').classList.contains('active')) {
    renderProfile();
  }
}

function updateStreak() {
  const today = new Date().toDateString();
  const lastLogin = localStorage.getItem('lastLoginDate') || '';
  if (lastLogin !== today) {
    const yesterday = new Date(Date.now() - 86400000).toDateString();
    if (lastLogin === yesterday) streakDays++;
    else streakDays = 1;
    localStorage.setItem('streakDays', streakDays);
    localStorage.setItem('lastLoginDate', today);
  }
  document.getElementById('streakFill').style.width = Math.min((streakDays % 7) / 7 * 100, 100) + '%';
  const nextMilestone = Math.ceil(streakDays / 7) * 7;
  const daysLeft = nextMilestone - streakDays;
  document.getElementById('streakNextMilestone').textContent = daysLeft > 0 ? `🔥 ${daysLeft} day${daysLeft>1?'s':''} until ${nextMilestone}-day bonus!` : '🎉 Milestone reached!';
}

function updateRoadmapProgress() {
  const items = document.querySelectorAll('.roadmap-item');
  let completed = 0;
  items.forEach(item => { if (item.dataset.completed === 'true') completed++; });
  document.getElementById('roadmapCompleted').textContent = completed;
  const dots = document.querySelectorAll('#roadmapProgress div');
  const total = dots.length;
  const progress = Math.min((completed / total) * 100, 100);
  dots.forEach((dot, index) => {
    const position = (index + 1) / total * 100;
    dot.style.background = position <= progress ? 'linear-gradient(90deg,#7b3af6,#00e5ff)' : 'var(--text-muted)';
  });
}

async function renderLeaderboard() {
  try {
    const response = await fetch(`${API_URL}/game/leaderboard`, {
      headers: {
        'Authorization': authToken ? `Bearer ${authToken}` : ''
      }
    });
    
    if (response.ok) {
      const data = await response.json();
      renderLeaderboardData(data);
      return;
    }
  } catch (error) {
    console.log('⚠️ Database leaderboard failed, using local');
  }
  
  const players = JSON.parse(localStorage.getItem('rushersLeague') || '[]');
  players.sort((a, b) => (b.coins || 0) - (a.coins || 0));
  renderLeaderboardData(players);
}

function renderLeaderboardData(players) {
  // Ensure current user is in leaderboard with latest coins
  if (username && username !== 'Guest') {
    const exists = players.some(p => (p.username || p.name) === username);
    if (!exists) {
      players.push({
        username: username,
        name: username,
        coins: coins,
        diamonds: diamonds,
        level: level,
        avatar: equippedAvatar,
        gamesPlayed: gameHistory.length
      });
    } else {
      // Update existing user's coins
      const userIndex = players.findIndex(p => (p.username || p.name) === username);
      if (userIndex !== -1) {
        players[userIndex].coins = coins;
        players[userIndex].diamonds = diamonds;
        players[userIndex].level = level;
        players[userIndex].avatar = equippedAvatar;
        players[userIndex].gamesPlayed = gameHistory.length;
      }
    }
    localStorage.setItem('rushersLeague', JSON.stringify(players));
  }
  
  players.sort((a, b) => (b.coins || 0) - (a.coins || 0));
  
  const podium = document.getElementById('lbPodium');
  const top3 = players.slice(0, 3);
  
  if (top3.length === 0) {
    podium.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);">No players yet. Be the first!</div>';
  } else {
    const medals = ['🥇', '🥈', '🥉'];
    const classes = ['first', 'second', 'third'];
    podium.innerHTML = top3.map((p, i) => `
      <div class="lb-podium-item ${classes[i]}">
        <div class="rank">${medals[i]}</div>
        <div class="avatar" style="font-size:${i===0?'2.2rem':i===1?'2rem':'1.8rem'};">${getAvatarEmoji(p.avatar || 'default')}</div>
        <div class="name">${p.username || p.name}</div>
        <div class="coins">${p.coins || 0}💰</div>
      </div>
    `).join('');
  }
  
  const list = document.getElementById('lbList');
  list.innerHTML = '';
  
  players.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'lb-list-item';
    const isYou = (p.username || p.name) === username;
    if (isYou) div.style.background = 'rgba(123,58,246,0.12)';
    
    div.innerHTML = `
      <span class="rank-num">${i + 1}</span>
      <div class="player-info">
        <div class="player-avatar" style="font-size:1.2rem;">${getAvatarEmoji(p.avatar || 'default')}</div>
        <span class="player-name">${p.username || p.name}${isYou ? ' ⭐ YOU' : ''}</span>
      </div>
      <span class="player-coins">${p.coins || 0}💰</span>
    `;
    list.appendChild(div);
  });
  
  document.getElementById('lbTotalPlayers').textContent = players.length + ' players';
}

async function syncLeaderboard() {
  let players = JSON.parse(localStorage.getItem('rushersLeague') || '[]');
  
  // Update current user
  const idx = players.findIndex(p => (p.username || p.name) === username);
  
  if (idx !== -1) {
    players[idx].coins = coins;
    players[idx].diamonds = diamonds;
    players[idx].level = level;
    players[idx].avatar = equippedAvatar;
    players[idx].gamesPlayed = gameHistory.length;
  } else if (username && username !== 'Guest') {
    players.push({
      username: username,
      name: username,
      coins: coins,
      diamonds: diamonds,
      level: level,
      avatar: equippedAvatar,
      gamesPlayed: gameHistory.length
    });
  }
  
  players.sort((a, b) => (b.coins || 0) - (a.coins || 0));
  localStorage.setItem('rushersLeague', JSON.stringify(players));
  localStorage.setItem('totalCoins', coins);
  localStorage.setItem('totalDiamonds', diamonds);
  
  // Sync to database
  if (authToken && username) {
    try {
      await fetch(`${API_URL}/user/${username}/update`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${authToken}`
        },
        body: JSON.stringify({
          coins, diamonds, xp, level,
          avatar: equippedAvatar,
          activeTheme: activeTheme,
          ownedAvatars: ownedAvatars,
          ownedThemes: ownedThemes,
          inventory: inventory
        })
      });
      console.log('✅ Leaderboard synced to database');
    } catch (error) {
      console.log('⚠️ Database sync failed');
    }
  }
  
  if (document.getElementById('leaderboardModal').classList.contains('active')) {
    await renderLeaderboard();
  }
}

async function openLeaderboard() {
  document.getElementById('leaderboardModal').classList.add('active');
  await renderLeaderboard();
}
function closeLeaderboard() { document.getElementById('leaderboardModal').classList.remove('active'); }

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        const data = JSON.parse(ev.target.result);
        if (!confirm('⚠️ Import will overwrite current data. Continue?')) return;
        Object.keys(data).forEach(key => {
          if (key !== 'timestamp') {
            localStorage.setItem(key, typeof data[key] === 'object' ? JSON.stringify(data[key]) : data[key]);
          }
        });
        showRewardPopup('📥 Data imported! Refreshing...');
        setTimeout(() => location.reload(), 1000);
      } catch (err) {
        alert('❌ Invalid file format!');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function drawWheel() {
  const canvas = document.getElementById('wheelCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const segments = [
    { label: '💰 10', type: 'coin', amount: 10, color: '#ffcd6d' },
    { label: '💰 20', type: 'coin', amount: 20, color: '#ff71a7' },
    { label: '💎 10', type: 'diamond', amount: 10, color: '#50fa7b' },
    { label: '💎 20', type: 'diamond', amount: 20, color: '#8be9fd' },
    { label: '💰 50', type: 'coin', amount: 50, color: '#ffb347' },
    { label: '💎 50', type: 'diamond', amount: 50, color: '#9b59b6' },
    { label: '💰 100', type: 'coin', amount: 100, color: '#f5e05a' },
    { label: '💎 100', type: 'diamond', amount: 100, color: '#3498db' }
  ];
  const radius = canvas.width / 2, center = radius, segmentAngle = (2 * Math.PI) / segments.length;
  let rotation = 0, spinning = false;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    segments.forEach((seg, i) => {
      const start = i * segmentAngle + rotation, end = (i + 1) * segmentAngle + rotation;
      ctx.beginPath(); ctx.moveTo(center, center); ctx.arc(center, center, radius - 2, start, end); ctx.closePath();
      ctx.fillStyle = seg.color; ctx.fill();
      ctx.save(); ctx.translate(center, center); ctx.rotate((i + 0.5) * segmentAngle + rotation);
      ctx.textAlign = 'center'; ctx.fillStyle = '#222'; ctx.font = 'bold 14px Poppins, sans-serif';
      ctx.fillText(seg.label, radius * 0.7, 6); ctx.restore();
    });
    ctx.fillStyle = '#ff4757'; ctx.beginPath();
    ctx.moveTo(center, center - radius + 10); ctx.lineTo(center + 12, center - radius + 28); ctx.lineTo(center - 12, center - radius + 28); ctx.closePath(); ctx.fill();
  }
  draw();
  canvas.onclick = function() {
    if (spinning) return;
    try { document.getElementById('clickSfx').play(); } catch(e) {}
    const last = localStorage.getItem('lastWheel');
    if (last && Date.now() - new Date(last).getTime() < 24 * 60 * 60 * 1000) { 
      alert('🎡 Daily Wheel available every 24 hours!'); 
      return; 
    }
    spinning = true;
    let velocity = 0.6 + Math.random() * 0.3, deceleration = 0.985;
    function spin() {
      if (velocity < 0.005) {
        spinning = false;
        const finalRotation = ((rotation % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
        let index = Math.floor(((2 * Math.PI - finalRotation) % (2 * Math.PI)) / segmentAngle) % segments.length;
        if (index < 0) index += segments.length;
        const reward = segments[index];
        if (reward.type === 'coin') { 
          coins += reward.amount; 
          localStorage.setItem('totalCoins', coins); 
          showRewardPopup('+' + reward.amount + ' 🪙 Coins!');
          syncToServer();
        } else { 
          diamonds += reward.amount; 
          localStorage.setItem('totalDiamonds', diamonds); 
          showRewardPopup('+' + reward.amount + ' 💎 Diamonds!');
        }
        localStorage.setItem('lastWheel', new Date().toISOString());
        updateAllDisplays(); 
        syncToServer();
        syncLeaderboard();
        spawnConfetti(30);
        try { document.getElementById('rewardSfx').play(); } catch(e) {}
        return;
      }
      rotation += velocity; velocity *= deceleration; draw(); requestAnimationFrame(spin);
    }
    spin();
  };
}

function spawnConfetti(count) {

    const div = document.createElement('div');
    div.style.cssText = `position:fixed; width:${Math.random()*6+4}px; height:${Math.random()*6+4}px; background:hsl(${Math.random()*360},88%,60%); left:${20+Math.random()*60}%; top:-10px; z-index:9999; pointer-events:none; border-radius:2px; opacity:${0.85-Math.random()*0.4}; transform:rotate(${Math.random()*360}deg);`;
    document.body.appendChild(div);
    let top = -10;
    const fall = setInterval(() => {
      top += Math.random() * 10 + 2;
      div.style.top = top + 'px';
      div.style.left = (parseFloat(div.style.left) + Math.random() * 4 - 2) + '%';
      if (top > window.innerHeight + 50) { div.remove(); clearInterval(fall); }
    }, 30);
  }
}

const chatToggle = document.getElementById('aiChatToggle');
const chatContainer = document.getElementById('aiChatContainer');
const chatClose = document.getElementById('aiChatClose');
const chatMessages = document.getElementById('aiChatMessages');
const chatInput = document.getElementById('aiChatInput');
const chatSend = document.getElementById('aiChatSend');
let chatHistory = [];

chatToggle.addEventListener('click', () => { chatContainer.classList.toggle('open'); if (chatContainer.classList.contains('open')) chatInput.focus(); });
chatClose.addEventListener('click', () => chatContainer.classList.remove('open'));

function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = 'ai-message ' + role;
  div.textContent = content;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

async function sendAIMessage(message) {
  if (!message.trim()) return;
  addMessage('user', message);
  chatInput.value = '';
  chatSend.disabled = true;
  try {
    const response = await fetch(`${API_URL}/ai/chat`, {
      method: 'POST',
      headers: { 
        'Content-Type': 'application/json',
        'Authorization': authToken ? `Bearer ${authToken}` : ''
      },
      body: JSON.stringify({ 
        message, 
        history: chatHistory.slice(-5),
        username: username || 'Guest'
      })
    });
    const data = await response.json();
    if (data.response) { addMessage('bot', data.response); chatHistory.push({ role: 'user', content: message }); chatHistory.push({ role: 'assistant', content: data.response }); }
    else { addMessage('bot', 'I\'m here to help! 🧠'); }
  } catch (error) {
    const fallbacks = ["I'm here to help! 🧠", "Earn coins by playing trivia!", "Build your streak daily for bonuses! 🔥", "Check the leaderboard to see your rank!", "Visit the shop to buy themes, avatars, and power-ups! 🏪"];
    addMessage('bot', fallbacks[Math.floor(Math.random() * fallbacks.length)]);
  }
  chatSend.disabled = false;
}
chatSend.addEventListener('click', () => sendAIMessage(chatInput.value));
chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendAIMessage(chatInput.value); });

// ==========================================
// GAME RESULT LISTENER
// ==========================================
window.addEventListener('gameResult', function(e) {
  if (e.detail) {
    const detail = e.detail;
    
    gameHistory.push({
      category: detail.category,
      score: detail.score || 0,
      correct: detail.correct || 0,
      total: detail.total || 0,
      coinsEarned: detail.coinsEarned || 0,
      date: new Date().toISOString()
    });
    localStorage.setItem('gameHistory', JSON.stringify(gameHistory));
    
    if (detail.coinsEarned) {
      coins += detail.coinsEarned;
      localStorage.setItem('totalCoins', coins);
    }
    
    if (detail.correct) {
      const earnedXP = detail.correct * 10 + (detail.coinsEarned || 0);
      xp += earnedXP;
      localStorage.setItem('totalXP', xp);
      
      let leveledUp = false;
      while (xp >= Math.floor(100 * Math.pow(level + 1, 1.5))) {
        level++;
        leveledUp = true;
        const bonus = level * 50;
        coins += bonus;
        localStorage.setItem('totalCoins', coins);
        if (leveledUp) {
          showRewardPopup(`🎉 Level Up! You're now Level ${level}! +${bonus} coins!`);
          spawnConfetti(40);
        }
      }
      localStorage.setItem('userLevel', level);
    }
    
    updateAllDisplays();
    updateGameStats();
    syncToServer();
    syncLeaderboard();
    updateStreak();
  }
});
