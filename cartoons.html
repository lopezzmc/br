<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Brain Rush — Cartoons</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

<style>
/* ============================================
   FULL SCREEN - CLEAN LOOK (LIKE REFERENCE)
   ============================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  height:100%;
  margin:0;
  padding:0;
  background:#f0f0f0;
  color:#111;
  overflow:hidden;
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;
  -webkit-font-smoothing:antialiased;
  -webkit-touch-callout:none;
  touch-action:manipulation;
}
.bg{
  position:fixed;
  inset:0;
  background:url('https://media.istockphoto.com/id/1469529416/vector/decorative-lined-paper-with-children-two-pages-funny-vector-illustration-eps.jpg?s=612x612&w=0&k=20&c=R9ntFhhrR3Hf8jlql_b-5ES_19Cxsjjx1HcbyScyf68=') center/cover no-repeat;
  z-index:0;
  filter:brightness(.98);
}
.overlay{position:fixed;inset:0;z-index:1;pointer-events:none;}
.stage{
  position:relative;
  z-index:2;
  height:100vh;
  width:100vw;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
}
.book{
  width:100%;
  height:100vh;
  max-width:100%;
  padding:8px;
  position:relative;
  display:flex;
  flex-direction:column;
}

/* ============================================
   HEADER - CLEAN LOOK
   ============================================ */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:6px;
  flex-wrap:nowrap;
  padding:8px 12px;
  flex-shrink:0;
  background:rgba(255,255,255,0.4);
  border-radius:16px;
  margin-bottom:4px;
}
.leftHeader{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:nowrap;
  flex-shrink:0;
}
.logoBox{
  width:48px;
  height:48px;
  border-radius:12px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border:1px solid rgba(0,0,0,0.04);
  flex-shrink:0;
  box-shadow:0 4px 15px rgba(0,0,0,0.06);
}
.logoBox img{
  width:85%;
  height:85%;
  object-fit:contain;
}
.titleWrap{
  display:flex;
  flex-direction:column;
  flex-shrink:0;
}
.title{
  font-family:"Patrick Hand",Inter,system-ui,sans-serif;
  font-size:22px;
  margin:0;
  font-weight:900;
  color:#111;
  line-height:1;
  background:linear-gradient(135deg,#7b3af6,#00e5ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.subtitle{
  font-size:9px;
  color:#888;
  font-weight:700;
  opacity:.8;
  margin-top:-2px;
  font-family:Inter;
  letter-spacing:0.5px;
  text-transform:uppercase;
}
.coins{
  display:flex;
  align-items:center;
  gap:4px;
  padding:4px 10px;
  border-radius:10px;
  background:#fff;
  border:1px solid rgba(0,0,0,0.03);
  font-weight:900;
  flex-shrink:0;
  box-shadow:0 4px 15px rgba(0,0,0,0.04);
}
.coins .coinEmoji{font-size:14px;}
.coins #headerCoins{font-size:14px;color:#222;}
.qcount{
  font-weight:900;
  color:#222;
  padding:4px 10px;
  background:rgba(255,255,255,0.8);
  border-radius:8px;
  font-size:12px;
  flex-shrink:0;
}
.header-right{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:nowrap;
  position:relative;
  flex-shrink:0;
}
.menu-btn{
  width:38px;
  height:38px;
  border-radius:50%;
  background:rgba(255,255,255,0.9);
  border:1px solid rgba(0,0,0,0.06);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:700;
  color:#222;
  position:relative;
  flex-shrink:0;
  box-shadow:0 2px 12px rgba(0,0,0,0.06);
}
.menu-btn .badge{
  position:absolute;
  top:-4px;
  right:-4px;
  background:#ff6b6b;
  color:#fff;
  font-size:8px;
  font-weight:800;
  width:16px;
  height:16px;
  border-radius:50%;
  display:none;
  align-items:center;
  justify-content:center;
}
.menu-btn .badge.show{display:flex;}

.menu-dropdown{
  position:absolute;
  top:100%;
  right:0;
  margin-top:6px;
  background:rgba(255,255,255,0.96);
  backdrop-filter:blur(20px);
  border-radius:14px;
  border:1px solid rgba(0,0,0,0.06);
  box-shadow:0 12px 48px rgba(0,0,0,0.12);
  padding:6px;
  z-index:1000;
  min-width:160px;
  opacity:0;
  transform:translateY(-10px) scale(0.96);
  pointer-events:none;
  transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  display:none;
}
.menu-dropdown.open{
  opacity:1;
  transform:translateY(0) scale(1);
  pointer-events:auto;
  display:block;
}
.menu-dropdown .menu-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
  font-size:13px;
  color:#222;
  width:100%;
  border:none;
  background:transparent;
  text-align:left;
}
.menu-dropdown .menu-item:hover{background:rgba(123,58,246,0.08);}
.menu-dropdown .menu-item .icon{font-size:14px;width:22px;text-align:center;}
.menu-dropdown .menu-item .count{
  margin-left:auto;
  background:rgba(123,58,246,0.12);
  padding:2px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:800;
  color:#7b3af6;
}
.menu-dropdown .menu-divider{height:1px;background:rgba(0,0,0,0.06);margin:4px 12px;}
.menu-dropdown .menu-item.danger{color:#ff4757;}

/* ============================================
   CARD - CLEAN FULL SCREEN
   ============================================ */
.card{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:6px;
  align-items:center;
  justify-content:center;
  width:100%;
  position:relative;
  min-height:0;
  background:rgba(255,255,255,0.25);
  border-radius:16px;
  padding:10px;
}

/* ============================================
   TIMER
   ============================================ */
.timer-wrapper{
  position:absolute;
  top:12px;
  right:16px;
  z-index:10;
}
.timer-circle{
  width:60px;
  height:60px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,0.9);
  border:4px solid #7b3af6;
  box-shadow:0 0 20px rgba(123,58,246,0.2);
  position:relative;
}
.timer-circle svg{
  position:absolute;
  top:-4px;
  left:-4px;
  width:60px;
  height:60px;
  transform:rotate(-90deg);
}
.timer-circle circle{
  fill:none;
  stroke:#00e5ff;
  stroke-width:4;
  stroke-dasharray:163.36;
  stroke-dashoffset:0;
  transition:stroke-dashoffset 1s linear;
}
.timer-circle .timer-num{
  font-size:22px;
  font-weight:900;
  color:#7b3af6;
  font-family:"Patrick Hand",Inter,sans-serif;
  position:relative;
  z-index:2;
}
.timer-circle .timer-num.warning{color:#ff6b6b;}
.timer-circle .timer-num.danger{color:#ff0000;animation:numPulse 0.5s ease-in-out infinite alternate;}
@keyframes numPulse{from{transform:scale(1);}to{transform:scale(1.15);}}

/* ============================================
   IMAGE - BIG & CENTERED
   ============================================ */
.image-container{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-shrink:0;
  width:100%;
  padding:4px 0;
}
#logoImg{
  max-height:200px;
  min-height:70px;
  object-fit:contain;
  border-radius:14px;
  display:block;
  background:rgba(255,255,255,0.5);
  transition:opacity 0.3s ease;
  opacity:0;
}
#logoImg.loaded{opacity:1;}
#logoImg.error{display:none;}

/* ============================================
   QUESTION - BIG & CLEAN
   ============================================ */
.question{
  font-family:"Patrick Hand",Inter,system-ui,sans-serif;
  font-size:1.2rem;
  font-weight:900;
  color:#111;
  text-align:center;
  padding:8px 12px;
  min-height:40px;
  flex-shrink:0;
  background:rgba(255,255,255,0.8);
  border-radius:14px;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}
.question.pop{animation:questionPop 0.3s ease;}
@keyframes questionPop{0%{transform:scale(1);}50%{transform:scale(1.03);}100%{transform:scale(1);}}

/* ============================================
   CHOICES - BIG & CLEAN
   ============================================ */
.choices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  width:100%;
  flex:1;
  align-content:center;
  min-height:100px;
}
.choice{
  min-height:52px;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  user-select:none;
  font-weight:900;
  font-size:1rem;
  font-family:"Patrick Hand",Inter,sans-serif;
  color:#fff;
  background:linear-gradient(-45deg,#1a9850,#2ecc71,#27ae60,#1a9850);
  background-size:400% 400%;
  border:3px solid #057d05;
  transition:all .25s ease;
  animation:gradientBG 8s ease infinite;
  padding:0 14px;
  text-align:center;
  touch-action:manipulation;
  word-break:break-word;
  line-height:1.2;
}
@keyframes gradientBG{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.choice:active{transform:scale(0.95);}
.choice.correct{border-color:#00ff00;background:linear-gradient(-45deg,#1a9850,#2ecc71);box-shadow:0 0 25px rgba(0,255,0,0.3);}
.choice.wrong{border-color:#ff0000;background:linear-gradient(-45deg,#c62828,#ef5350);animation:wrongShake 0.5s ease;}
@keyframes wrongShake{0%{transform:translateX(0);}25%{transform:translateX(-6px);}50%{transform:translateX(6px);}75%{transform:translateX(-3px);}100%{transform:translateX(0);}}

/* ============================================
   FEEDBACK & PROGRESS
   ============================================ */
.feedback{
  min-height:20px;
  font-weight:800;
  text-align:center;
  color:#333;
  padding:2px;
  font-size:0.75rem;
  flex-shrink:0;
}
.progressWrap{
  margin-top:2px;
  display:flex;
  flex-direction:column;
  gap:2px;
  align-items:stretch;
  width:100%;
  flex-shrink:0;
}
.progressBar{
  height:6px;
  background:rgba(0,0,0,0.05);
  border-radius:999px;
  overflow:hidden;
}
.progressFill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#7b3af6,#00e5ff);
  transition:width .5s ease;
}

/* ============================================
   FINAL SCREEN
   ============================================ */
.final{
  position:absolute;
  inset:0;
  z-index:12;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:8px;
  background:rgba(255,255,255,0.95);
  border-radius:16px;
  padding:20px;
  text-align:center;
  display:none;
  animation:finalPop 0.5s ease;
}
@keyframes finalPop{0%{transform:scale(0.8);opacity:0;}50%{transform:scale(1.05);}100%{transform:scale(1);opacity:1;}}
.final h2{font-family:"Patrick Hand",Inter;font-size:1.5rem;margin:2px 0;color:#0b6b3a;}
.final .score{font-weight:900;color:#222;font-size:0.9rem;}
.final .btns{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;justify-content:center;}
.btn{
  padding:8px 18px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  font-weight:900;
  background:linear-gradient(90deg,#7b3af6,#00e5ff);
  color:#fff;
  box-shadow:0 12px 36px rgba(0,0,0,0.12);
  touch-action:manipulation;
  min-height:38px;
  min-width:70px;
  font-size:0.8rem;
  transition:transform 0.2s ease;
}
.btn:active{transform:scale(0.92);}

.floating-emoji{
  position:fixed;
  font-size:34px;
  pointer-events:none;
  z-index:200;
  animation:floatUp 1.2s ease-out forwards;
}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(0.5) rotate(0deg);}50%{opacity:1;transform:translateY(-80px) scale(1.2) rotate(20deg);}100%{opacity:0;transform:translateY(-160px) scale(0.8) rotate(-10deg);}}

.confetti{
  position:fixed;
  width:6px;
  height:6px;
  top:-20px;
  pointer-events:none;
  z-index:40;
  opacity:.95;
  border-radius:2px;
  animation:confettiFall 2000ms linear forwards;
}
@keyframes confettiFall{to{transform:translateY(110vh) rotate(720deg);opacity:.95;}}

/* ============================================
   RESPONSIVE
   ============================================ */
@media(max-height:700px){
  .header{padding:4px 8px;gap:4px;}
  .logoBox{width:34px;height:34px;}
  .title{font-size:16px;}
  .subtitle{font-size:7px;}
  .coins{padding:2px 6px;}
  .coins .coinEmoji{font-size:10px;}
  .coins #headerCoins{font-size:10px;}
  .qcount{font-size:9px;padding:2px 6px;}
  .menu-btn{width:30px;height:30px;font-size:16px;}
  .card{padding:6px;gap:4px;}
  #logoImg{max-height:110px;min-height:40px;}
  .question{font-size:0.9rem;padding:4px 8px;min-height:30px;}
  .choice{min-height:36px;font-size:0.75rem;padding:0 8px;border-width:2px;}
  .choices{gap:6px;min-height:70px;}
  .timer-circle{width:48px;height:48px;}
  .timer-circle svg{width:48px;height:48px;}
  .timer-circle .timer-num{font-size:18px;}
  .timer-wrapper{top:8px;right:10px;}
}

@media(min-height:701px) and (max-height:850px){
  #logoImg{max-height:150px;min-height:55px;}
  .question{font-size:1rem;}
  .choice{min-height:44px;font-size:0.85rem;}
}

@media(min-height:851px){
  #logoImg{max-height:240px;min-height:80px;}
  .question{font-size:1.3rem;}
  .choice{min-height:56px;font-size:1.05rem;border-width:3px;}
  .logoBox{width:54px;height:54px;}
  .title{font-size:24px;}
  .header{padding:10px 16px;}
  .menu-btn{width:42px;height:42px;font-size:22px;}
  .coins .coinEmoji{font-size:16px;}
  .coins #headerCoins{font-size:16px;}
  .qcount{font-size:13px;}
}
</style>
</head>
<body>

<!-- ===== NO LANDSCAPE LOCK ===== -->

<!-- BACKGROUND -->
<div class="bg"></div>
<div class="overlay"></div>

<!-- GAME STAGE -->
<div class="stage">
  <div class="book">
    <!-- HEADER -->
    <div class="header">
      <div class="leftHeader">
        <div class="logoBox"><img src="logo.png" alt="logo" onerror="this.style.display='none'"></div>
        <div class="titleWrap">
          <div class="title">Brain Rush</div>
          <div class="subtitle">Cartoons</div>
        </div>
        <div>
          <div class="qcount" id="qcount">1/10</div>
        </div>
      </div>
      <div class="header-right" style="position:relative;">
        <div class="coins"><span class="coinEmoji">💰</span> <span id="headerCoins">0</span></div>
        
        <button class="menu-btn" id="menuBtn" onclick="toggleMenu()">
          ⋮
          <span class="badge" id="menuBadge">!</span>
        </button>
        
        <div class="menu-dropdown" id="menuDropdown">
          <button class="menu-item" onclick="useHint()">
            <span class="icon">💡</span>
            Hint
            <span class="count" id="hintCountDisplay">0</span>
          </button>
          <button class="menu-item" onclick="useExtraTime()">
            <span class="icon">⏰</span>
            +15s Time
            <span class="count" id="timeCountDisplay">0</span>
          </button>
          <button class="menu-item" onclick="skipQuestion()">
            <span class="icon">🔄</span>
            Skip Question
            <span class="count" id="skipCountDisplay">0</span>
          </button>
          <button class="menu-item" onclick="useDoubleCoins()">
            <span class="icon">💰</span>
            2x Coins
            <span class="count" id="doubleCountDisplay">0</span>
          </button>
          <div class="menu-divider"></div>
          <button class="menu-item" onclick="goHome()">
            <span class="icon">🏠</span>
            Home
          </button>
          <button class="menu-item danger" onclick="resetGame()">
            <span class="icon">🔄</span>
            Reset Game
          </button>
        </div>
      </div>
    </div>

    <!-- CARD -->
    <div class="card">
      <!-- Timer -->
      <div class="timer-wrapper">
        <div class="timer-circle" id="timerCircle">
          <svg viewBox="0 0 60 60">
            <circle id="timerProgress" cx="30" cy="30" r="26" stroke="#ddd" stroke-width="4" fill="none" />
            <circle id="timerProgressActive" cx="30" cy="30" r="26" stroke="#7b3af6" stroke-width="4" fill="none"
              stroke-dasharray="163.36" stroke-dashoffset="0" />
          </svg>
          <span class="timer-num" id="timerNum">15</span>
        </div>
      </div>

      <!-- Image -->
      <div class="image-container">
        <img id="logoImg" src="" alt="Cartoon Image">
      </div>

      <!-- Question -->
      <div class="question" id="question">Loading…</div>

      <!-- Choices -->
      <div class="choices" id="choices" role="list" aria-live="polite"></div>

      <!-- Feedback -->
      <div class="feedback" id="feedback" aria-live="polite"></div>

      <!-- Progress -->
      <div class="progressWrap">
        <div class="progressBar"><div class="progressFill" id="progressFill"></div></div>
      </div>

      <!-- Final -->
      <div id="final" class="final">
        <h2>🎬 Cartoon Master!</h2>
        <div class="score" id="finalScore">You answered 0 / 10 correctly</div>
        <div style="margin-top:4px;"><div class="score" id="coinSummary">Earned 0 🪙</div></div>
        <div class="btns">
          <button class="btn" id="playAgain">🔄 Play Again</button>
          <button class="btn" id="goHomeBtn">🏠 Home</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- AUDIO -->
<audio id="clickS" preload="auto"><source src="click.mp3" type="audio/mpeg"></audio>
<audio id="coinS" preload="auto"><source src="coin.mp3" type="audio/mpeg"></audio>
<audio id="cheerS" preload="auto"><source src="cheer.mp3" type="audio/mpeg"></audio>
<audio id="wrongS" preload="auto"><source src="wrong.mp3" type="audio/mpeg"></audio>
<audio id="bgMusic" loop><source src="background-music.mp3" type="audio/mpeg"></audio>

<script>
// ============================================
// NO LANDSCAPE LOCK
// ============================================

// ============================================
// BACKEND INTEGRATION
// ============================================
const API_URL = 'https://br-0p1t.onrender.com/api';
let authToken = localStorage.getItem('authToken');

// ============================================
// POWER-UP SYSTEM
// ============================================
function getShopInventory() {
  try {
    const raw = localStorage.getItem('shop_inventory');
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return parsed.map(item => {
      if (typeof item === 'string') return { id: item, qty: 1 };
      return { id: item.id, qty: item.qty || 1 };
    });
  } catch {
    return [];
  }
}

function saveShopInventory(inventory) {
  localStorage.setItem('shop_inventory', JSON.stringify(inventory));
  window.shopInventory = inventory;
}

function getPowerupQty(powerupId) {
  const inventory = getShopInventory();
  const found = inventory.find(item => item.id === powerupId);
  return found ? found.qty : 0;
}

function usePowerup(powerupId) {
  const inventory = getShopInventory();
  const found = inventory.find(item => item.id === powerupId);
  if (!found || found.qty <= 0) return false;
  found.qty--;
  const updated = inventory.filter(item => item.qty > 0);
  saveShopInventory(updated);
  return true;
}

// ============================================
// MENU SYSTEM
// ============================================
let menuOpen = false;

function toggleMenu() {
  menuOpen = !menuOpen;
  document.getElementById('menuDropdown').classList.toggle('open', menuOpen);
  if (menuOpen) updateMenuCounts();
}

document.addEventListener('click', function(e) {
  const menuBtn = document.getElementById('menuBtn');
  const dropdown = document.getElementById('menuDropdown');
  if (!menuBtn.contains(e.target) && !dropdown.contains(e.target)) {
    menuOpen = false;
    dropdown.classList.remove('open');
  }
});

function goHome() {
  menuOpen = false;
  document.getElementById('menuDropdown').classList.remove('open');
  
  // Send game result before going home
  if (score > 0) {
    sendGameResult();
  }
  
  window.location.href = 'index.html';
}

function resetGame() {
  if (confirm('🔄 Reset this game?')) {
    menuOpen = false;
    document.getElementById('menuDropdown').classList.remove('open');
    location.reload();
  }
}

// ============================================
// POWER-UP USAGE
// ============================================
function useHint() {
  menuOpen = false;
  document.getElementById('menuDropdown').classList.remove('open');
  
  if (!usePowerup('hint')) {
    showFeedback('💡 No hints left! Buy in Shop!', '#ff4757');
    return;
  }
  
  if (!currentSet || currentQ >= currentSet.length) return;
  
  const correctAnswer = currentSet[currentQ].a;
  const btns = choicesEl.children;
  let wrongIndices = [];
  for (let i = 0; i < btns.length; i++) {
    if (i !== correctAnswer && btns[i].style.pointerEvents !== 'none') {
      wrongIndices.push(i);
    }
  }
  
  if (wrongIndices.length === 0) {
    showFeedback('🤔 No wrong answers to remove!', '#ffa94d');
    return;
  }
  
  updateMenuCounts();
  
  for (let i = 0; i < 2 && wrongIndices.length > 0; i++) {
    const idx = wrongIndices.splice(Math.floor(Math.random() * wrongIndices.length), 1)[0];
    if (btns[idx]) {
      btns[idx].style.opacity = '0.3';
      btns[idx].style.pointerEvents = 'none';
      btns[idx].style.textDecoration = 'line-through';
    }
  }
  
  showFeedback('💡 Removed 2 wrong answers!', '#7b3af6');
}

function useExtraTime() {
  menuOpen = false;
  document.getElementById('menuDropdown').classList.remove('open');
  
  if (!usePowerup('extratime')) {
    showFeedback('⏰ No extra time left!', '#ff4757');
    return;
  }
  
  updateMenuCounts();
  timeLeft += 15;
  updateTimer();
  showFeedback('⏰ +15 seconds added!', '#7b3af6');
}

function skipQuestion() {
  menuOpen = false;
  document.getElementById('menuDropdown').classList.remove('open');
  
  if (!usePowerup('skip')) {
    showFeedback('🔄 No skips left!', '#ff4757');
    return;
  }
  
  if (isAnswered) return;
  isAnswered = true;
  clearInterval(timerInterval);
  
  updateMenuCounts();
  showFeedback('🔄 Skipped!', '#ffa94d');
  currentQ++;
  if (currentQ < currentSet.length) {
    setTimeout(loadQuestion, 500);
  } else {
    setTimeout(finishQuiz, 500);
  }
}

function useDoubleCoins() {
  menuOpen = false;
  document.getElementById('menuDropdown').classList.remove('open');
  
  if (!usePowerup('doublecoins')) {
    showFeedback('💰 No 2x coins left!', '#ff4757');
    return;
  }
  
  updateMenuCounts();
  window.doubleCoinsActive = true;
  showFeedback('💰 2x Coins ACTIVE for next correct answer!', '#f59e0b');
}

  document.getElementById('hintCountDisplay').textContent = getPowerupQty('hint');

}

// ============================================

// ============================================
async function syncCoinsToBackend(amount) {
  if (!authToken) return false;
  try {
    const response = await fetch(API_URL + '/user/update-resources', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + authToken
      },
      body: JSON.stringify({ coins: amount })
    });
    const data = await response.json();
    if (data.coins !== undefined) {
      window.dispatchEvent(new CustomEvent('coinsUpdated', { 
        detail: { coins: data.coins } 
      }));
      return true;
    }
  } catch (error) {
    console.error('❌ Coin sync error:', error);
    return false;
  }
}

// ============================================
// SHUFFLE FUNCTION
// ============================================
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

let currentSet = [], currentQ = 0, score = 0;
let totalCoins = Number(localStorage.getItem('totalCoins')) || 0;

let timerInterval, timeLeft = 15;
let isAnswered = false;
let streak = 0;

const CIRCUMFERENCE = 2 * Math.PI * 26;

// ====== STREAK ======
function updateStreak(isCorrect){
  if(isCorrect){
    streak++;
    if(streak>=3){
      const bonus=Math.min(streak,5);
      totalCoins+=bonus;
      localStorage.setItem('totalCoins',totalCoins);
      headerCoinsEl.textContent=totalCoins;
      syncCoinsToBackend(bonus);
      showFloatingEmoji('🔥');
      feedbackEl.textContent=`🔥 ${streak} in a row! +${bonus} bonus!`;
      feedbackEl.style.color='#ff6b6b';
      setTimeout(()=>{feedbackEl.textContent='';feedbackEl.style.color='#333';},1500);
    }
  } else {
    streak=0;
  }
}

function showFloatingEmoji(emoji){
  const el=document.createElement('div');
  el.className='floating-emoji';
  el.textContent=emoji;
  el.style.left=(40+Math.random()*20)+'%';
  el.style.top='40%';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1200);
}

function miniConfetti(){
  const colors=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff6bff','#ffa94d'];
  for(let i=0;i<15;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.backgroundColor=colors[Math.floor(Math.random()*colors.length)];
    c.style.left=(10+Math.random()*80)+'vw';
    c.style.animationDuration=(0.8+Math.random()*1)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),2000);
  }
}

function newSet(){
  const shuffledBank = shuffleArray([...CARTOON_BANK]);
  currentSet = shuffledBank.slice(0, 10).map(q => {
    const shuffledChoices = shuffleArray([...q.choices]);
    const newCorrectIndex = shuffledChoices.indexOf(q.choices[q.a]);
    return {
      img: q.img || null,
      q: q.q || "Which character/cartoon is this?",
      choices: shuffledChoices,
      a: newCorrectIndex
    };
  });
  currentQ=0;score=0;
}

function loadQuestion(){
  if(currentQ>=currentSet.length){ finishQuiz(); return; }
  isAnswered=false;
  let current=currentSet[currentQ];

  logoImg.classList.remove('loaded');
  logoImg.classList.remove('error');
  
  if (current.img) {
    const img = new Image();
    img.onload = function() {
      logoImg.src = current.img;
      logoImg.classList.add('loaded');
      logoImg.style.display = 'block';
    };
    img.onerror = function() {
      logoImg.style.display = 'none';
    };
    img.src = current.img;
  } else {
    logoImg.style.display = 'none';
  }

  questionEl.textContent = current.q;
  questionEl.classList.remove('pop');
  void questionEl.offsetWidth;
  questionEl.classList.add('pop');

  choicesEl.innerHTML='';
  const letters = ['A', 'B', 'C', 'D'];
  current.choices.forEach((c, i) => {
    const btn=document.createElement('div');
    btn.className='choice';
    btn.textContent = `${letters[i]}. ${c}`;
    btn.dataset.index = i;
    btn.addEventListener('click',(e)=>{e.preventDefault();selectAnswer(btn,i,current.a);});
    btn.addEventListener('touchend',(e)=>{e.preventDefault();selectAnswer(btn,i,current.a);});
    choicesEl.appendChild(btn);
  });
  qcountEl.textContent=`${currentQ+1}/10`;
  progressFill.style.width=`${(currentQ/10)*100}%`;
  startTimer();
}

function startTimer(){
  clearInterval(timerInterval);
  timeLeft=TOTAL_TIME;
  updateTimer();
  timerInterval=setInterval(()=>{
    timeLeft--;
    updateTimer();
    if(timeLeft<=3 && timeLeft>0){
      timerNum.className='timer-num danger';
    } else if(timeLeft<=5 && timeLeft>3){
      timerNum.className='timer-num warning';
    }
    if(timeLeft<=0 && !isAnswered){
      clearInterval(timerInterval);
      const current=currentSet[currentQ];
      Array.from(choicesEl.children).forEach((btn,idx)=>{
        if(idx===current.a)btn.classList.add('correct');
        btn.style.pointerEvents='none';
      });
      setTimeout(()=>{currentQ++;loadQuestion();},1500);
    }
  },1000);
}

function updateTimer(){
  timerNum.textContent=timeLeft;
  const dashOffset = CIRCUMFERENCE * (1 - timeLeft / TOTAL_TIME);
  timerProgress.style.strokeDashoffset = dashOffset;
}

function selectAnswer(btn, index, answer){
  if(isAnswered) return;
  isAnswered=true;
  if(bgMusic.paused) bgMusic.play();
  clickS.currentTime=0;clickS.play();
  clearInterval(timerInterval);
  
  if(index===answer){
    btn.classList.add('correct');
    score++;
    
    let coinsEarned = pointsPerQ;
    if (window.doubleCoinsActive) {
      coinsEarned = pointsPerQ * 2;
      window.doubleCoinsActive = false;
      showFeedback('💰 2x Coins! +' + coinsEarned, '#f59e0b');
    }
    
    totalCoins += coinsEarned;
    localStorage.setItem('totalCoins', totalCoins);
    headerCoinsEl.textContent = totalCoins;
    syncCoinsToBackend(coinsEarned);
    
    window.dispatchEvent(new CustomEvent('coinsUpdated', { 
      detail: { coins: totalCoins } 
    }));
    
    coinS.currentTime=0;coinS.play();
    coinPop(coinsEarned);
    updateStreak(true);
    const msg=correctMessages[Math.floor(Math.random()*correctMessages.length)];
    const emoji=correctEmojis[Math.floor(Math.random()*correctEmojis.length)];
    showFloatingEmoji(emoji);
    feedbackEl.textContent=`✅ ${msg}`;
    feedbackEl.style.color='#1fb97a';
    setTimeout(()=>{feedbackEl.textContent='';feedbackEl.style.color='#333';},1000);
    miniConfetti();
    Array.from(choicesEl.children).forEach(c=>c.style.pointerEvents='none');
    setTimeout(()=>{currentQ++;loadQuestion();},800);
  } else {
    btn.classList.add('wrong');
    updateStreak(false);
    const msg=wrongMessages[Math.floor(Math.random()*wrongMessages.length)];
    const emoji=wrongEmojis[Math.floor(Math.random()*wrongEmojis.length)];
    showFloatingEmoji(emoji);
    feedbackEl.textContent=`❌ ${msg}`;
    feedbackEl.style.color='#ff4757';
    setTimeout(()=>{feedbackEl.textContent='';feedbackEl.style.color='#333';},1200);
    if(wrongS){wrongS.currentTime=0;wrongS.play();}
    Array.from(choicesEl.children).forEach((c,idx)=>{
      if(idx===answer)c.classList.add('correct');
      c.style.pointerEvents='none';
    });
    setTimeout(()=>{currentQ++;loadQuestion();},1500);
  }
}

// ============================================
// sendGameResult() - UPDATES MAIN PAGE STATS
// ============================================
function sendGameResult() {
  const gameData = {
    category: 'cartoons',
    score: score * 10,
    correct: score,
    total: currentSet.length || 10,
    coinsEarned: score * 10
  };
  
  window.dispatchEvent(new CustomEvent('gameResult', {
    detail: gameData
  }));
  
  let gameHistory = JSON.parse(localStorage.getItem('gameHistory') || '[]');
  gameHistory.push({
    category: gameData.category,
    score: gameData.score,
    correct: gameData.correct,
    total: gameData.total,
    coinsEarned: gameData.coinsEarned,
    date: new Date().toISOString()
  });
  localStorage.setItem('gameHistory', JSON.stringify(gameHistory));
  
  console.log('✅ Game result sent to main page!', gameData);
}

// ============================================
// finishQuiz()
// ============================================
function finishQuiz(){
  finalEl.style.display='flex';
  const messages=['🎬 Cartoon Master!','🌟 You\'re a Star!','💪 Animation Champ!','🏆 You Rock!','🎉 Amazing Knowledge!'];
  document.querySelector('.final h2').textContent=`🎉 ${messages[Math.floor(Math.random()*messages.length)]}`;
  finalScoreEl.textContent=`You answered ${score} / 10 correctly!`;
  coinSummaryEl.textContent=`Earned ${score*pointsPerQ} 🪙 coins!`;
  cheerS.currentTime=0;cheerS.play();
  progressFill.style.width='100%';
  
  for(let i=0;i=80;i++){
    setTimeout(()=>{
      const c=document.createElement('div');
      c.className='confetti';
      c.style.backgroundColor=`hsl(${Math.random()*360},100%,50%)`;
      c.style.left=`${Math.random()*100}vw`;
      c.style.animationDuration=`${Math.random()*2+1.5}s`;
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),2500);
    },i*35);
  }
  
  // Send game result to main page
  sendGameResult();
  
  if(authToken){
    try{
      fetch(`${API_URL}/game/save-result`,{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':`Bearer ${authToken}`},
        body:JSON.stringify({category:'cartoons',score:score*10,questionsAnswered:currentSet.length,correctAnswers:score,timeSpent:60})
      }).then(res=>res.json()).then(data=>console.log('✅ Game saved:',data)).catch(err=>console.error('❌ Save error:',err));
    }catch(e){console.error('❌ Save error:',e);}
  }
}
