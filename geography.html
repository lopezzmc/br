    function saveShopInventory(inventory) {
      localStorage.setItem('shop_inventory', JSON.stringify(inventory));
      window.shopInventory = inventory;
    }

    function getPowerupQty(powerupId) {
      const inventory = getShopInventory();
      const found = inventory.find(item => item.id === powerupId);
      return found ? found.qty : 0;
    }

    function usePowerup(powerupId) {
      const inventory = getShopInventory();
      const found = inventory.find(item => item.id === powerupId);
      if (!found || found.qty <= 0) return false;
      found.qty--;
      const updated = inventory.filter(item => item.qty > 0);
      saveShopInventory(updated);
      return true;
    }

    // ============================================
    // MENU SYSTEM
    // ============================================
    let menuOpen = false;

    function toggleMenu() {
      menuOpen = !menuOpen;
      document.getElementById('menuDropdown').classList.toggle('open', menuOpen);
      if (menuOpen) updateMenuCounts();
    }

    document.addEventListener('click', function(e) {
      const menuBtn = document.getElementById('menuBtn');
      const dropdown = document.getElementById('menuDropdown');
      if (!menuBtn.contains(e.target) && !dropdown.contains(e.target)) {
        menuOpen = false;
        dropdown.classList.remove('open');
      }
    });

    function goHome() {
      menuOpen = false;
      document.getElementById('menuDropdown').classList.remove('open');
      window.location.href = 'index.html';
    }

    function resetGame() {
      if (confirm('🔄 Reset this game?')) {
        menuOpen = false;
        document.getElementById('menuDropdown').classList.remove('open');
        location.reload();
      }
    }

    // ============================================
    // POWER-UP USAGE FUNCTIONS
    // ============================================
    function useHint() {
      menuOpen = false;
      document.getElementById('menuDropdown').classList.remove('open');
      
      if (!usePowerup('hint')) {
        showFeedback('💡 No hints left! Buy in Shop!', '#ff4757');
        return;
      }
      
      if (!currentSet || currentQ >= currentSet.length) return;
      
      const correctIndex = currentSet[currentQ].a;
      const btns = choicesEl.children;
      let wrongIndices = [];
      for (let i = 0; i < btns.length; i++) {
        if (i !== correctIndex && btns[i].style.pointerEvents !== 'none') {
          wrongIndices.push(i);
        }
      }
      
      if (wrongIndices.length === 0) {
        showFeedback('🤔 No wrong answers to remove!', '#ffa94d');
        return;
      }
      
      updateMenuCounts();
      
      for (let i = 0; i < 2 && wrongIndices.length > 0; i++) {
        const idx = wrongIndices.splice(Math.floor(Math.random() * wrongIndices.length), 1)[0];
        if (btns[idx]) {
          btns[idx].style.opacity = '0.3';
          btns[idx].style.pointerEvents = 'none';
          btns[idx].style.textDecoration = 'line-through';
        }
      }
      
      showFeedback('💡 Removed 2 wrong answers!', '#7b3af6');
      
      const active = document.querySelectorAll('.choice:not([style*="pointer-events: none"])');
      if (active.length === 1) {
        active[0].classList.add('correct');
        showFeedback('🎯 Only correct answer remains!', '#4ade80');
      }
    }

    function useExtraTime() {
      menuOpen = false;
      document.getElementById('menuDropdown').classList.remove('open');
      
      if (!usePowerup('extratime')) {
        showFeedback('⏰ No extra time left!', '#ff4757');
        return;
      }
      
      updateMenuCounts();
      timeLeft += 15;
      updateTimerVisual();
      showFeedback('⏰ +15 seconds added!', '#7b3af6');
    }

    function skipQuestion() {
      menuOpen = false;
      document.getElementById('menuDropdown').classList.remove('open');
      
      if (!usePowerup('skip')) {
        showFeedback('🔄 No skips left!', '#ff4757');
        return;
      }
      
      if (isAnswered) return;
      isAnswered = true;
      clearInterval(timerInterval);
      
      updateMenuCounts();
      showFeedback('🔄 Skipped!', '#ffa94d');
      currentQ++;
      if (currentQ < currentSet.length) {
        setTimeout(loadQuestion, 500);
      } else {
        setTimeout(finishQuiz, 500);
      }
    }

    function useDoubleCoins() {
      menuOpen = false;
      document.getElementById('menuDropdown').classList.remove('open');
      
      if (!usePowerup('doublecoins')) {
        showFeedback('💰 No 2x coins left!', '#ff4757');
        return;
      }
      
      updateMenuCounts();
      window.doubleCoinsActive = true;
      showFeedback('💰 2x Coins ACTIVE for next correct answer!', '#f59e0b');
    }

    function updateMenuCounts() {
      document.getElementById('hintCountDisplay').textContent = getPowerupQty('hint');
      document.getElementById('hintCountDisplay').className = 'count' + (getPowerupQty('hint') <= 0 ? ' empty' : '');
      document.getElementById('timeCountDisplay').textContent = getPowerupQty('extratime');
      document.getElementById('timeCountDisplay').className = 'count' + (getPowerupQty('extratime') <= 0 ? ' empty' : '');
      document.getElementById('skipCountDisplay').textContent = getPowerupQty('skip');
      document.getElementById('skipCountDisplay').className = 'count' + (getPowerupQty('skip') <= 0 ? ' empty' : '');
      document.getElementById('doubleCountDisplay').textContent = getPowerupQty('doublecoins');
      document.getElementById('doubleCountDisplay').className = 'count' + (getPowerupQty('doublecoins') <= 0 ? ' empty' : '');
      
      const badge = document.getElementById('menuBadge');
      const total = getPowerupQty('hint') + getPowerupQty('extratime') + getPowerupQty('skip') + getPowerupQty('doublecoins');
      badge.classList.toggle('show', total > 0);
      badge.textContent = total > 9 ? '9+' : total;
    }

    // ============================================
    // COIN SYNC
    // ============================================
    async function syncCoinsToBackend(amount) {
      if (!authToken) return false;
      try {
        const response = await fetch(API_URL + '/user/update-resources', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + authToken
          },
          body: JSON.stringify({ coins: amount })
        });
        const data = await response.json();
        if (data.coins !== undefined) {
          window.dispatchEvent(new CustomEvent('coinsUpdated', { 
            detail: { coins: data.coins } 
          }));
          return true;
        }
      } catch (error) {
        console.error('❌ Coin sync error:', error);
        return false;
      }
    }

    // ============================================
    // 🔀 SHUFFLE FUNCTION
    // ============================================
    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // ============================================
    // GEOGRAPHY BANK - Reduced for speed
    // ============================================
    const BANK = [
      { q: "What is the largest continent by area?", choices: ["Africa", "Asia", "Europe", "Antarctica"], a: 1 },
      { q: "Which country has the largest population?", choices: ["India", "USA", "China", "Russia"], a: 2 },
      { q: "What is the capital of Australia?", choices: ["Sydney", "Melbourne", "Canberra", "Brisbane"], a: 2 },

      { q: "Which country is known as the Land of the Rising Sun?", choices: ["China", "Japan", "Thailand", "South Korea"], a: 1 },
      { q: "Mount Everest is located in which mountain range?", choices: ["Andes", "Himalayas", "Rockies", "Alps"], a: 1 },
      { q: "Which desert is the largest in the world?", choices: ["Sahara", "Gobi", "Arabian", "Kalahari"], a: 0 },
      { q: "Which ocean is the deepest?", choices: ["Pacific", "Atlantic", "Indian", "Arctic"], a: 0 },
      { q: "What is the capital of Canada?", choices: ["Toronto", "Vancouver", "Ottawa", "Montreal"], a: 2 },
      { q: "Which country has the most time zones?", choices: ["USA", "Russia", "France", "China"], a: 1 },
      { q: "Which country is completely landlocked?", choices: ["Switzerland", "Poland", "Netherlands", "Egypt"], a: 0 },
      { q: "Which continent is known as the Dark Continent?", choices: ["Africa", "Asia", "Europe", "South America"], a: 0 },
      { q: "Which country has the longest coastline?", choices: ["Canada", "Australia", "Russia", "USA"], a: 0 },
      { q: "What is the smallest country in the world?", choices: ["Monaco", "Vatican City", "Malta", "San Marino"], a: 1 },
      { q: "Which African country was never colonized?", choices: ["Ethiopia", "Nigeria", "Ghana", "Kenya"], a: 0 },
      { q: "Which country is famous for its fjords?", choices: ["Norway", "Sweden", "Iceland", "Finland"], a: 0 },
      { q: "What is the capital of Brazil?", choices: ["Rio de Janeiro", "São Paulo", "Brasília", "Salvador"], a: 2 },
      { q: "Which country has the largest rainforest?", choices: ["Brazil", "Congo", "Indonesia", "Peru"], a: 0 }
    ];

    // ============================================
    // GAME ENGINE
    // ============================================
    let currentSet = [], currentQ = 0, score = 0;
    let totalCoins = Number(localStorage.getItem('totalCoins')) || 0;
    let pointsPerQ = 10;
    let timeLeft = 15, timerInterval;
    let isAnswered = false;
    let streak = 0;
    const TOTAL_TIME = 15;
    let doubleCoinsActive = false;

    const questionEl = document.getElementById('question');
    const choicesEl = document.getElementById('choices');
    const progressFill = document.getElementById('progressFill');
    const qcountEl = document.getElementById('qcount');
    const finalEl = document.getElementById('final');
    const finalScoreEl = document.getElementById('finalScore');
    const coinSummaryEl = document.getElementById('coinSummary');
    const headerCoinsEl = document.getElementById('headerCoins');
    const streakBadge = document.getElementById('streakBadge');
    const streakCount = document.getElementById('streakCount');
    const playAgainBtn = document.getElementById('playAgain');
    const goHomeBtn = document.getElementById('goHomeBtn');
    const clickS = document.getElementById('clickS');
    const coinS = document.getElementById('coinS');
    const cheerS = document.getElementById('cheerS');
    const wrongS = document.getElementById('wrongS');
    const bgMusic = document.getElementById('bgMusic');

    const timerCompact = document.getElementById('timerCompact');
    const ringProgress = document.getElementById('ringProgress');
    const ringPulse = document.getElementById('ringPulse');
    const timerNum = document.getElementById('timerNum');
    const timerStatusText = document.getElementById('timerStatusText');

    headerCoinsEl.textContent = totalCoins;
    const circumference = 2 * Math.PI * 42;

    function updateStreak(isCorrect){
      if(isCorrect){
        streak++;
        streakBadge.classList.remove('hidden');
        streakCount.textContent=streak;
        if(streak>=3){
          const bonus=Math.min(streak,5);
          totalCoins+=bonus;
          localStorage.setItem('totalCoins',totalCoins);
          headerCoinsEl.textContent=totalCoins;
          syncCoinsToBackend(bonus);
          showFloatingEmoji('🔥');
          const fb=document.getElementById('feedback');
          fb.textContent=`🔥 ${streak} in a row! +${bonus} bonus!`;
          fb.style.color='#ff6b6b';
          setTimeout(()=>{fb.textContent='';fb.style.color='#333';},1500);
        }
      } else {
        streak=0;
        streakBadge.classList.add('hidden');
      }
    }

    function showFloatingEmoji(emoji){
      const el=document.createElement('div');
      el.className='floating-emoji';
      el.textContent=emoji;
      el.style.left=(40+Math.random()*20)+'%';
      el.style.top='40%';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),1200);
    }

    function miniConfetti(){
      const colors=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff6bff','#ffa94d'];
      for(let i=0;i<15;i++){
        const c=document.createElement('div');
        c.className='confetti';
        c.style.backgroundColor=colors[Math.floor(Math.random()*colors.length)];
        c.style.left=(10+Math.random()*80)+'vw';
        c.style.animationDuration=(0.8+Math.random()*1)+'s';
        document.body.appendChild(c);
        setTimeout(()=>c.remove(),2000);
      }
    }

    function newSet(){
      const shuffledBank = shuffleArray([...BANK]);
      currentSet = shuffledBank.slice(0, 10).map(q => {
        const choicesWithIndex = q.choices.map((text, idx) => ({ text, isCorrect: idx === q.a }));
        const shuffledChoices = shuffleArray([...choicesWithIndex]);
        const newCorrectIndex = shuffledChoices.findIndex(c => c.isCorrect);
        return {
          q: q.q,
          choices: shuffledChoices.map(c => c.text),
          a: newCorrectIndex
        };
      });
      currentQ=0;score=0;
    }

    function loadQuestion() {
      if (currentQ >= currentSet.length) { finishQuiz(); return; }
      
      isAnswered = false;
      
      questionEl.textContent = currentSet[currentQ].q;
      questionEl.classList.remove('pop');
      void questionEl.offsetWidth;
      questionEl.classList.add('pop');
      
      choicesEl.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D'];
      currentSet[currentQ].choices.forEach((c, i) => {
        let btn = document.createElement('div');
        btn.className = 'choice';
        btn.textContent = `${letters[i]}. ${c}`;
        btn.dataset.index = i;
        btn.addEventListener('click', (e) => { e.preventDefault(); selectAnswer(btn, i, currentSet[currentQ].a); });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); selectAnswer(btn, i, currentSet[currentQ].a); });
        choicesEl.appendChild(btn);
      });
      qcountEl.textContent = `${currentQ + 1}/10`;
      progressFill.style.width = `${(currentQ / 10) * 100}%`;
      startTimer();
    }

    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = TOTAL_TIME;
      updateTimerVisual();
      timerCompact.className = 'timer-compact';
      timerNum.className = 'timer-num';
      timerStatusText.className = 'timer-status-text';
      timerStatusText.textContent = '⏳ Go!';
      
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerVisual();
        
        if (timeLeft <= 5 && timeLeft > 3) {
          timerCompact.className = 'timer-compact warning';
          timerNum.className = 'timer-num warning';
          timerStatusText.className = 'timer-status-text warning';
          timerStatusText.textContent = '⚠️ Hurry!';
        } else if (timeLeft <= 3 && timeLeft > 0) {
          timerCompact.className = 'timer-compact danger';
          timerNum.className = 'timer-num danger';
          timerStatusText.className = 'timer-status-text danger';
          timerStatusText.textContent = '🔥 GO!';
        }
        
        if (timeLeft <= 0 && !isAnswered) {
          clearInterval(timerInterval);
          timerStatusText.textContent = '⏰ Time!';
          timerStatusText.className = 'timer-status-text danger';
          timerCompact.className = 'timer-compact danger';
          
          const correct = currentSet[currentQ].a;
          Array.from(choicesEl.children).forEach((btn, idx) => {
            if (idx === correct) btn.classList.add('correct');
            btn.style.pointerEvents = 'none';
          });
          setTimeout(() => {
            currentQ++;
            loadQuestion();
          }, 1500);
        }
      }, 1000);
    }

    function updateTimerVisual() {
      const percentage = (timeLeft / TOTAL_TIME) * 100;
      const offset = circumference - (percentage / 100) * circumference;
      
      ringProgress.style.strokeDashoffset = offset;
      ringPulse.style.strokeDashoffset = offset;
      timerNum.textContent = timeLeft;
      
      if (percentage > 60) {
        ringProgress.style.stroke = '#7b3af6';
      } else if (percentage > 33) {
        ringProgress.style.stroke = '#ffa94d';
      } else {
        ringProgress.style.stroke = '#ff6b6b';
      }
    }

    function selectAnswer(btn, i, correct) {
      if (isAnswered) return;
      isAnswered = true;
      
      if (bgMusic.paused) bgMusic.play();
      clickS.currentTime = 0; clickS.play();
      clearInterval(timerInterval);

      if (i === correct) {
        btn.classList.add('correct');
        score++;
        
        let coinsEarned = pointsPerQ;
        if (window.doubleCoinsActive) {
          coinsEarned = pointsPerQ * 2;
          window.doubleCoinsActive = false;
          showFeedback('💰 2x Coins! +' + coinsEarned, '#f59e0b');
        }
        
        totalCoins += coinsEarned;
        localStorage.setItem('totalCoins', totalCoins);
        headerCoinsEl.textContent = totalCoins;
        syncCoinsToBackend(coinsEarned);
        
        window.dispatchEvent(new CustomEvent('coinsUpdated', { 
          detail: { coins: totalCoins } 
        }));
        
        coinS.currentTime = 0; coinS.play();
        coinPop(coinsEarned);
        updateStreak(true);
        const msg = correctMessages[Math.floor(Math.random() * correctMessages.length)];
        const emoji = correctEmojis[Math.floor(Math.random() * correctEmojis.length)];
        showFloatingEmoji(emoji);
        timerCompact.className = 'timer-compact correct';
        timerNum.className = 'timer-num';
        timerNum.style.color = '#1fb97a';
        timerStatusText.className = 'timer-status-text correct';
        timerStatusText.textContent = msg;
        ringProgress.style.stroke = '#1fb97a';
        const fb = document.getElementById('feedback');
        fb.textContent = `✅ ${msg}`;
        fb.style.color = '#1fb97a';
        setTimeout(() => { fb.textContent = ''; fb.style.color = '#333'; }, 1000);
        miniConfetti();
        Array.from(choicesEl.children).forEach(ch => ch.style.pointerEvents = 'none');
        setTimeout(() => {
          currentQ++;
          loadQuestion();
        }, 800);
      } else {
        btn.classList.add('wrong');
        updateStreak(false);
        const msg = wrongMessages[Math.floor(Math.random() * wrongMessages.length)];
        const emoji = wrongEmojis[Math.floor(Math.random() * wrongEmojis.length)];
        showFloatingEmoji(emoji);
        timerCompact.className = 'timer-compact wrong';
        timerNum.className = 'timer-num';
        timerNum.style.color = '#ff4757';
        timerStatusText.className = 'timer-status-text wrong';
        timerStatusText.textContent = '😅 Try again!';
        ringProgress.style.stroke = '#ff4757';
        const fb = document.getElementById('feedback');
        fb.textContent = `❌ ${msg}`;
        fb.style.color = '#ff4757';
        setTimeout(() => { fb.textContent = ''; fb.style.color = '#333'; }, 1200);
        if (wrongS) { wrongS.currentTime = 0; wrongS.play(); }
        Array.from(choicesEl.children).forEach((ch, idx) => {
          if (idx === correct) ch.classList.add('correct');
          ch.style.pointerEvents = 'none';
        });
        setTimeout(() => {
          currentQ++;
          loadQuestion();
        }, 1500);
      }
    }

    function finishQuiz() {
      finalEl.style.display = 'flex';
      const messages = ['🌍 World Explorer!','🗺️ Geography Genius!','🏆 You Rock!','🌟 Amazing Knowledge!','💪 World Traveler!'];
      document.querySelector('.final h2').textContent = `🎉 ${messages[Math.floor(Math.random() * messages.length)]}`;
      finalScoreEl.textContent = `You answered ${score} / 10 correctly!`;
      coinSummaryEl.textContent = `Earned ${score * pointsPerQ} 🪙 coins!`;
      cheerS.currentTime = 0; cheerS.play();
      progressFill.style.width = '100%';
      
      for (let i = 0; i < 100; i++) {
        setTimeout(() => {
          const c = document.createElement('div');
          c.className = 'confetti';
          c.style.backgroundColor = `hsl(${Math.random() * 360},100%,50%)`;
          c.style.left = `${Math.random() * 100}vw`;
          c.style.animationDuration = `${Math.random() * 2 + 1.5}s`;
          document.body.appendChild(c);
          setTimeout(() => c.remove(), 2500);
        }, i * 30);
      }
      
      if (authToken) {
        try {
          const timeSpent = 60;
          fetch(`${API_URL}/game/save-result`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${authToken}`
            },
            body: JSON.stringify({
              category: 'geography',
              score: score * 10,
              questionsAnswered: 10,
              correctAnswers: score,
              timeSpent: timeSpent
            })
          })
          .then(res => res.json())
          .then(data => console.log('✅ Game saved:', data))
          .catch(err => console.error('❌ Save error:', err));
        } catch (e) {
          console.error('❌ Save error:', e);
        }
      }
    }

    playAgainBtn.addEventListener('click', () => {
      finalEl.style.display = 'none';
      score = 0;
      streak = 0;
      doubleCoinsActive = false;
      streakBadge.classList.add('hidden');
      newSet();
      loadQuestion();
      updateMenuCounts();
    });

    goHomeBtn.addEventListener('click', () => window.location.href = "index.html");

    function coinPop(amount) {
      const pop = document.createElement('div');
      pop.textContent = `+${amount} 🪙`;
      pop.style.cssText = `
        position: fixed; top: 20px; right: 20px; 
        font-weight: 900; font-size: 18px;
        color: #fbc531; z-index: 100; 
        opacity: 1; transition: all 1s ease-out;
        pointer-events: none;
        background: rgba(0,0,0,0.7);
        padding: 6px 14px;
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      `;
      document.body.appendChild(pop);
      setTimeout(() => { pop.style.transform = 'translateY(-50px)'; pop.style.opacity = '0'; }, 50);
      setTimeout(() => pop.remove(), 1000);
    }

    function showFeedback(message, color) {
      const fb = document.getElementById('feedback');
      fb.textContent = message;
      fb.style.color = color || '#333';
      setTimeout(() => { fb.textContent = ''; fb.style.color = '#333'; }, 2000);
    }

    // ============================================
    // MESSAGES
    // ============================================
    const correctMessages = ["🎉 Amazing!","⭐ You're a star!","🧠 Brain power!","💪 Keep it up!","✨ Brilliant!","🎯 Nailed it!","🏆 You rock!","🌟 Genius!"];
    const wrongMessages = ["😅 Oops! Try again!","🤔 Almost!","💪 Don't give up!","🧠 Learning is fun!","⭐ You're still a star!","🎯 Keep practicing!"];
    const correctEmojis = ["🎉","⭐","🌟","💪","✨","🏆","💎","🔥"];
    const wrongEmojis = ["😅","🤔","💪","🧠","⭐","🎯"];

    // ============================================
    // LISTEN FOR COIN UPDATES
    // ============================================
    window.addEventListener('coinsUpdated', (e) => {
      if (e.detail && e.detail.coins !== undefined) {
        totalCoins = e.detail.coins;
        headerCoinsEl.textContent = totalCoins;
        localStorage.setItem('totalCoins', totalCoins);
      }
    });

    // ============================================
    // INIT
    // ============================================
    authToken = localStorage.getItem('authToken');
    newSet();
    loadQuestion();
    updateMenuCounts();

    console.log('🌍 Geography loaded with:');
    console.log('✅ Forced landscape mode');
    console.log('✅ Shuffled answer options (ABCD)');
    console.log('✅ Shop power-ups integration');
    console.log(`📦 Inventory:`, getShopInventory());
  </script>
</body>

</html>
